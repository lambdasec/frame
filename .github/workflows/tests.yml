name: Tests

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  schedule:
    # Nightly: the full benchmark sweep is too slow for every push.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install
      run: pip install -e ".[dev]"
    - name: Ruff (real-bug rules, see pyproject.toml)
      run: ruff check frame tests benchmarks
    - name: Mypy (informational, not yet enforced)
      continue-on-error: true
      run: mypy frame

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported (requires-python >= 3.10).
        python-version: ['3.10', '3.13']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    # Install exactly what a user following the README gets (".[scan]"),
    # plus dev tooling, so a missing grammar in the extra fails here.
    - name: Install
      run: pip install -e ".[dev]"
    - name: Verify user install path
      run: |
        python -m venv /tmp/userenv
        /tmp/userenv/bin/pip install -q .[scan]
        /tmp/userenv/bin/python -c "from frame.sil.scanner import FrameScanner; import frame.sil.frontends.c_frontend, frame.sil.frontends.java_frontend, frame.sil.frontends.javascript_frontend, frame.sil.frontends.csharp_frontend, frame.sil.frontends.python_frontend"
        # the built-in framework packs are package data: an install without them scans without framework knowledge
        /tmp/userenv/bin/python -c "from frame.sil.packs import builtin_packs; n = len(builtin_packs()); assert n >= 70, n"
        printf 'import tornado.web\nclass H(tornado.web.RequestHandler):\n    def get(self):\n        self.write("<b>" + self.get_argument("n"))\n' > /tmp/userenv/t.py
        /tmp/userenv/bin/frame scan /tmp/userenv/t.py -f json --fail-on none | grep -q CWE-79
    - name: Run tests
      run: python -m pytest tests/ -n auto -q --tb=short
    - name: Quick functionality test
      run: |
        python -c "
        from frame import EntailmentChecker
        result = EntailmentChecker().check_entailment('x |-> 5 |- x |-> 5')
        assert result.valid, 'Basic entailment check failed'
        print('Basic functionality test passed')
        "

  self-scan:
    # Frame's own SCA on this repository: resolve its Python dependencies (pyproject with
    # extras, requirements files) and fail on a known high or critical vulnerability. Test and
    # benchmark fixtures hold vulnerable dependencies on purpose and are excluded.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install
      run: pip install -e .
    - name: Advisories
      run: |
        if ! frame kb pull --advisories --project . ; then
          echo "advisory dataset unavailable; building the PyPI table from OSV's export"
          curl -sSfL -o "$RUNNER_TEMP/PyPI.zip" https://osv-vulnerabilities.storage.googleapis.com/PyPI/all.zip
          frame kb build-advisories "$RUNNER_TEMP/PyPI.zip" "$RUNNER_TEMP/advisories" --revision ci --ecosystems PyPI
          echo "FRAME_ADVISORIES_SOURCE=$RUNNER_TEMP/advisories" >> "$GITHUB_ENV"
          FRAME_ADVISORIES_SOURCE="$RUNNER_TEMP/advisories" frame kb pull --advisories --project .
        fi
    - name: Known vulnerabilities in Frame's dependencies
      run: frame deps . --exclude tests --exclude benchmarks --resolve --vulns --fail-on high

  sca-real:
    # `frame deps` against the real package managers (tests/sca_real/): each tool resolves a
    # fixture project, lists what it resolved, and Frame's reading must match. Runs on pushes to
    # main, nightly and on dispatch; on pull requests only when the SCA code or its tests change.
    # A missing tool fails the job (FRAME_SCA_REAL=1 never skips). Pinned to 24.04: the Swift
    # setup action does not support newer Ubuntu images yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Decide whether this pull request touches SCA
      id: scope
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -qE '^(frame/sca/|tests/sca_real/|tests/fixtures/sca/|tests/test_sca_)'; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "No SCA changes in this pull request; skipping the package-manager tests."
        fi
    - uses: actions/setup-python@v5
      if: steps.scope.outputs.run == 'true'
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml
    - uses: actions/setup-java@v4
      if: steps.scope.outputs.run == 'true'
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: tests/sca_real/projects/maven/**/pom.xml
    - uses: gradle/actions/setup-gradle@v4
      if: steps.scope.outputs.run == 'true'
      with:
        gradle-version: '8.10.2'
    - uses: actions/setup-node@v4
      if: steps.scope.outputs.run == 'true'
      with:
        node-version: '20'
    - uses: actions/setup-dotnet@v4
      if: steps.scope.outputs.run == 'true'
      with:
        dotnet-version: '8.0.x'
    - uses: actions/setup-go@v5
      if: steps.scope.outputs.run == 'true'
      with:
        go-version: '1.22'
        cache: false
    - uses: astral-sh/setup-uv@v5
      if: steps.scope.outputs.run == 'true'
    - uses: swift-actions/setup-swift@v2
      if: steps.scope.outputs.run == 'true'
      with:
        swift-version: '6.0'
    - uses: ruby/setup-ruby@v1
      if: steps.scope.outputs.run == 'true'
      with:
        ruby-version: '3.3'
    - uses: shivammathur/setup-php@v2
      if: steps.scope.outputs.run == 'true'
      with:
        php-version: '8.2'
        tools: composer
    - uses: dart-lang/setup-dart@v1
      if: steps.scope.outputs.run == 'true'
    - uses: erlef/setup-beam@v1
      if: steps.scope.outputs.run == 'true'
      with:
        otp-version: '27'
        elixir-version: '1.17'
    - name: Install
      if: steps.scope.outputs.run == 'true'
      run: |
        corepack enable
        pip install -e ".[dev]"
        for t in npm corepack uvx mvn gradle dotnet go cargo swift ruby bundle composer dart mix; do printf '%-9s' "$t"; command -v "$t"; done
    - name: Frame against the package managers
      if: steps.scope.outputs.run == 'true'
      env:
        FRAME_SCA_REAL: '1'
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      run: python -m pytest tests/test_sca_real_tools.py tests/test_sca_apply.py -v --tb=short

  benchmarks:
    # Full curated sweep (4,742 cases: SL-COMP, QF_S, QF_AX, QF_BV).
    # Runs nightly and on manual dispatch, plus on pushes to main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install
      run: pip install -e ".[dev]"
    - name: Cache benchmark files
      uses: actions/cache@v4
      with:
        path: ./benchmarks/cache
        key: ${{ runner.os }}-benchmarks-${{ hashFiles('benchmarks/downloaders/**/*.py') }}
        restore-keys: |
          ${{ runner.os }}-benchmarks-
    - name: Download curated benchmarks
      run: python -m benchmarks download --curated
    - name: Run curated benchmarks
      run: python -m benchmarks run --curated --output ci_results.json
    - name: Check benchmark results
      run: |
        python -c "
        import json
        with open('ci_results.json') as f:
            results = json.load(f)
        correct = sum(1 for r in results if r['expected'] == r['actual'])
        total = len(results)
        accuracy = correct / total * 100 if total > 0 else 0
        print(f'Benchmark Results: {correct}/{total} correct ({accuracy:.1f}%)')
        assert accuracy >= 80, f'Accuracy too low: {accuracy:.1f}% < 80%'
        "
