name: False positive
description: Frame reported something that is not a vulnerability.
title: "[FP] "
labels: ["false positive", "analysis"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The smallest code that still produces the finding is the most useful thing you can give us.
        Please remove anything confidential first.
  - type: input
    id: version
    attributes:
      label: Frame version
      description: Output of `frame --version`.
      placeholder: frame 1.1.4
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Code (SAST)
        - Dependencies (SCA)
        - Secrets
        - Infrastructure as code
        - Containers
        - AI applications / MCP
        - Authorization hunt (--hunt-authz)
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language and framework
      placeholder: Python / Django 5.0
  - type: textarea
    id: finding
    attributes:
      label: The finding
      description: The finding as Frame printed it (type, CWE, location, data flow). JSON output is welcome.
      render: text
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code that reproduces it
      description: One or a few files. Mark the line Frame flagged.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is safe
      description: What prevents the attack (a sanitizer, a guard, a type, a framework guarantee)?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: frame scan src/ --root .
