"pymysql.Cursor" = ["cursor", "cur"]
"MySQLdb.Connection" = ["connection", "conn"]
"MySQLdb.Cursor" = ["cursor", "cur"]
"django.db.backends.utils.CursorWrapper" = ["cursor", "cur"]
"sqlalchemy.engine.Engine" = ["engine"]
"sqlalchemy.engine.Connection" = ["connection", "conn"]
"sqlalchemy.orm.Session" = ["session"]
"sqlalchemy.orm.session.Session" = ["session"]
"sqlalchemy.orm.scoped_session" = ["session"]
"flask_sqlalchemy.SQLAlchemy" = ["db"]
"flask_sqlalchemy.query.Query" = ["query"]
"sqlalchemy.orm.Query" = ["query"]
"django.db.models.Manager" = ["objects"]
"logging.Logger" = ["logger"]
"flask.Response" = ["response"]
"flask.wrappers.Response" = ["response"]
"werkzeug.wrappers.Response" = ["response"]
"django.http.HttpResponse" = ["response"]
"flask.Flask" = ["app"]
"ldap3.Connection" = ["conn", "connection"]
"lxml.etree._ElementTree" = ["etree_tree"]
"lxml.etree._Element" = ["etree_tree"]
"xml.etree.ElementTree.ElementTree" = ["etree_tree"]
"xml.etree.ElementTree.Element" = ["etree_tree"]
"sqlalchemy.engine.Result" = ["result"]
"sqlalchemy.pool.PoolProxiedConnection" = ["connection", "conn"]
"aiosqlite.Connection" = ["connection", "conn"]
"aiosqlite.Cursor" = ["cursor", "cur"]
"sqlalchemy.engine.CursorResult" = ["result"]
"django.db.models.QuerySet" = ["objects"]
"io.IOBase" = ["file"]
"asyncpg.Connection" = ["asyncpg_conn"]
"asyncpg.Pool" = ["asyncpg_conn"]
"aiomysql.Cursor" = ["cursor", "cur"]
"aiopg.Cursor" = ["cursor", "cur"]

# JavaScript SQL clients (each package's README / API reference; the sinks are packs/data/
# javascript/sql-drivers.toml and typeorm.toml). A class under `receivers` types its instances.
# mysql / mysql2: createConnection returns a Connection, createPool a Pool, both with `query`
# (mysql2 adds `execute`); mysql2's `pool.promise()` is the same pool with promises, and its
# promise API's getConnection() resolves to a pooled Connection.
[javascript.returns]
"mysql.createConnection" = "mysql.Connection"
"mysql.createPool" = "mysql.Pool"
"mysql2.createConnection" = "mysql2.Connection"
"mysql2.createPool" = "mysql2.Pool"
"mysql2.Pool.promise" = "mysql2.Pool"
"mysql2.Connection.promise" = "mysql2.Connection"
"mysql2/promise.createConnection" = "mysql2.Connection"
"mysql2/promise.createPool" = "mysql2.Pool"
"mysql2.Pool.getConnection" = "mysql2.Connection"
# node-postgres (node-postgres.com/apis/pool): pool.connect() resolves to a PoolClient.
"pg.Pool.connect" = "pg.PoolClient"
"pg-pool.connect" = "pg.PoolClient"
# sqlite3: require("sqlite3").verbose() is the module itself with long stack traces.
"sqlite3.verbose.Database" = "sqlite3.Database"
# sqlite (the promise wrapper): open({ filename, driver }) resolves to a Database.
"sqlite.open" = "sqlite.Database"
# mssql: connect() resolves to the global ConnectionPool; pool.request() is a Request.
"mssql.connect" = "mssql.ConnectionPool"
"mssql.ConnectionPool.connect" = "mssql.ConnectionPool"
"mssql.ConnectionPool.request" = "mssql.Request"
# oracledb: getConnection() / pool.getConnection() resolve to a Connection.
"oracledb.getConnection" = "oracledb.Connection"
"oracledb.createPool" = "oracledb.Pool"
"oracledb.Pool.getConnection" = "oracledb.Connection"
# MongoDB driver: a client's db() is a Db, a Db's collection() a Collection; MongoClient.connect
# resolves to the client (3.x and later). The 2.x driver's connect gave a Db, so `.collection` on
# what connect produced is a Collection too (the two versions never call the other's method).
"mongodb.MongoClient.connect" = "mongodb.MongoClient"
"mongodb.MongoClient.connect.collection" = "mongodb.Collection"
"mongodb.connect" = "mongodb.MongoClient"
"mongodb.connect.collection" = "mongodb.Collection"
"mongodb.MongoClient.db" = "mongodb.Db"
"mongodb.Db.collection" = "mongodb.Collection"
# Mongoose: model() returns a Model (on the default connection or one createConnection made);
# a Model's query methods return a Query, as do a Query's own.
"mongoose.model" = "mongoose.Model"
"mongoose.createConnection" = "mongoose.Connection"
"mongoose.Connection.model" = "mongoose.Model"
"mongoose.connection.model" = "mongoose.Model"
"@typegoose/typegoose.getModelForClass" = "mongoose.Model"
"mongoose.Model.find" = "mongoose.Query"
"mongoose.Model.findOne" = "mongoose.Query"
"mongoose.Model.where" = "mongoose.Query"
"mongoose.Query.find" = "mongoose.Query"
"mongoose.Query.where" = "mongoose.Query"
"mongoose.Query.sort" = "mongoose.Query"
"mongoose.Query.limit" = "mongoose.Query"
"mongoose.Query.skip" = "mongoose.Query"
"mongoose.Query.select" = "mongoose.Query"
"mongoose.Query.populate" = "mongoose.Query"
"mongoose.Query.lean" = "mongoose.Query"
# Electron (electronjs.org/docs/latest/api): a window's and a view's webContents is a WebContents,
