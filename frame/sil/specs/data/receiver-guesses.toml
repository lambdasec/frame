# A name heuristic, kept as data until value origins type every receiver (docs/roadmap.md, "No
# framework or benchmark knowledge in the engine", stage 4): a call on a lower-case receiver of
# unknown origin (`parts.join(sep)`, `sb.append(x)`) is also looked up under these receiver names
# of the language's spec table, in this order. A guess only ever yields a propagation row, never a
# source, sink or sanitizer (Program._get_spec): guessing those made `app.get(path, handler)` the
# `request` HTTP client's SSRF sink and `form.getName()` a path sanitizer. A receiver whose origin
# is known (frame/sil/value_origins.py) and a capitalised receiver are never guessed.
# Read by frame/sil/specs/receiver_guesses.py.
python = ["str", "bytes", "list", "dict", "ConfigParser", "configparser.ConfigParser"]
java = ["request", "session", "connection", "URLDecoder", "URLEncoder", "java.net.URLDecoder", "java.net.URLEncoder",
        "Base64", "String", "StringBuilder", "StringBuffer"]
csharp = ["String", "StringBuilder"]
