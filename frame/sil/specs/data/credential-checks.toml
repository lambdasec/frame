# Calls that compare a caller's guess with a stored secret: a password, a one-time code, a token.
# Read by frame/sil/hunt_classes.py to rank the units of the business-logic hunt's brute-force
# class (a handler that makes such a check is where a missing attempt limit matters). A ranking
# signal only: no finding is made from it.
#
# Each entry is a callee id as Frame resolves it (`Call.canonical`) or as written; an id matches a
# call whose canonical id is it or ends with `.<id>`, or whose written name is it.

python = [
  "werkzeug.security.check_password_hash", "flask_bcrypt.Bcrypt.check_password_hash",
  "bcrypt.checkpw", "django.contrib.auth.authenticate", "django.contrib.auth.hashers.check_password",
  "argon2.PasswordHasher.verify", "passlib.context.CryptContext.verify", "pyotp.TOTP.verify",
  "pyotp.HOTP.verify", "hmac.compare_digest", "secrets.compare_digest",
]
javascript = [
  "bcrypt.compare", "bcrypt.compareSync", "bcryptjs.compare", "bcryptjs.compareSync",
  "argon2.verify", "crypto.timingSafeEqual", "speakeasy.totp.verify", "speakeasy.hotp.verify",
  "otplib.authenticator.check", "otplib.authenticator.verify", "otplib.totp.check",
  "otplib.totp.verify", "otplib.hotp.check",
]
java = [
  "org.springframework.security.crypto.password.PasswordEncoder.matches",
  "org.springframework.security.authentication.AuthenticationManager.authenticate",
  "org.mindrot.jbcrypt.BCrypt.checkpw", "java.security.MessageDigest.isEqual",
]
csharp = [
  "Microsoft.AspNetCore.Identity.PasswordHasher.VerifyHashedPassword",
  "Microsoft.AspNetCore.Identity.IPasswordHasher.VerifyHashedPassword",
  "Microsoft.AspNetCore.Identity.SignInManager.PasswordSignInAsync",
  "Microsoft.AspNetCore.Identity.SignInManager.CheckPasswordSignInAsync",
  "Microsoft.AspNetCore.Identity.UserManager.CheckPasswordAsync",
  "Microsoft.AspNetCore.Identity.SignInManager.TwoFactorSignInAsync",
  "BCrypt.Net.BCrypt.Verify", "System.Security.Cryptography.CryptographicOperations.FixedTimeEquals",
]

# Library classes whose own methods compare the guess with the stored secret: an application view
# or form built on one handles a guess though none of its methods calls a check (Weblate's WebAuthn
# view inherits the assertion check). Matched against a class's resolved bases, the project's
# intermediate classes included.
[bases]
python = [
  "django.contrib.auth.forms.AuthenticationForm", "django.contrib.auth.views.LoginView",
  "django.contrib.auth.forms.PasswordChangeForm", "django.contrib.auth.views.PasswordChangeView",
  "django_otp.forms.OTPTokenForm", "django_otp.forms.OTPAuthenticationForm",
  "django_otp.forms.OTPAuthenticationFormMixin",
  "django_otp_webauthn.views.CompleteCredentialAuthenticationView",
  "rest_framework.authtoken.views.ObtainAuthToken",
  "rest_framework_simplejwt.views.TokenObtainPairView",
]
