# Sink kinds and finding types: what each sink kind reports and what each finding type is.
#
# [[sink]]: one per SinkKind value (frame/sil/instructions.py). `vuln` is the finding type a
# flow into it reports (none: a generic taint flow); `aliases` are other spellings spec tables
# and packs may use for it.
# [[vuln]]: one per VulnType value (frame/sil/translator.py), with its CWE (where it has one)
# and its category (findings.CATEGORIES).
#
# Loaded strictly by frame/sil/kinds.py: an unknown key, a kind or type listed twice or missing,
# an alias that is itself a kind, or an unknown category is an error.

