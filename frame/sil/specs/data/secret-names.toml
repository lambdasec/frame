# Hardcoded credentials found by the name a literal is assigned to (`password = "..."`), and the
# value shapes that say such a literal holds no secret. Read by frame/sil/secret_names.py (strictly:
# an unknown key or a pattern that does not compile is an error); the rules that use them are in
# FrameScanner._hardcoded_secret_checks. Provider token formats found in any literal are
# secret-formats.toml.
#
# Patterns are Python regular expressions in TOML literal strings.

# A credential-named assignment target (matched against the SIL, so every language, and only real
# `name = "literal"` assignments). The first rule that matches gives the CWE.
[[name_rule]]
pattern = '(?i)(^|[._])(pass(word|wd)?|pwd)([._]|$)'
cwe = "CWE-259"
label = "Hardcoded password"

[[name_rule]]
pattern = '(?i)(crypt|secret|private|signing)[._]?key'
cwe = "CWE-321"
label = "Hardcoded cryptographic key"

[[name_rule]]
pattern = '(?i)(^|[._])(api[._]?key|access[._]?key|secret|token|client[._]?secret|auth[._]?token)([._]|$)'
cwe = "CWE-798"
label = "Hardcoded secret"

[value]
# An embedded credential inside a value ("Server=db;Password=s3cret;"), with a non-trivial value.
connection_string = '(?i)(password|pwd)\s*=\s*\S{3,}'
# Values that are obviously not real secrets.
placeholders = ["", "password", "changeme", "change_me", "your_password", "your_password_here",
                "xxx", "xxxx", "todo", "none", "null", "example", "test", "placeholder"]
# Key material: a PEM block with a body (matched across lines; escapes arrive unprocessed, so a
# "\n" in source is two characters).
pem_with_body = '-----BEGIN [A-Z0-9 ]+-----(?:(?!-----END).){0,512}?[A-Za-z0-9+/]{16,}'

# Values that are always reported, whatever the shapes below say: a full credential of a known
# format, or one of these prefixes at any length.
[[value.known_credential]]
pattern = '\b(?:AKIA|ASIA|AGPA|AIDA|AROA|ANPA|ANVA|AIPA)[0-9A-Z]{16}\b'
description = "AWS access key id"

[[value.known_credential]]
pattern = '\bgh[pousr]_[A-Za-z0-9]{36,}'
description = "GitHub token"

[[value.known_credential]]
pattern = '\bgithub_pat_[A-Za-z0-9_]{22,}'
description = "GitHub fine-grained personal access token"

[[value.known_credential]]
pattern = '\bglpat-[A-Za-z0-9_-]{20,}'
description = "GitLab personal access token"

[[value.known_credential]]
pattern = '\bxox[baprs]-[A-Za-z0-9-]{10,}'
description = "Slack token"

[[value.known_credential]]
pattern = '\bAIza[0-9A-Za-z_-]{35}'
description = "Google API key"

[[value.known_credential]]
pattern = '\b[sr]k_(?:live|test)_[0-9A-Za-z]{16,}'
description = "Stripe secret key"

[[value.known_credential]]
pattern = '\beyJ[A-Za-z0-9_-]{5,}\.eyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{10,}'
description = "JWT"

[value.credential_prefixes]
# Each matched at a word boundary.
patterns = ['[srp]k_(?:live|test)_', 'gh[pousr]_', 'github_pat_', 'glpat-', 'xox[baprs]-', 'SG\.',
            'AKIA', 'ASIA', 'AIza', 'eyJ']

# Shapes of a value that is not a secret, matched against the whole value.
[[value.not_secret]]
pattern = '(?:[A-Z][A-Z0-9]* )+(?:KEY|CERTIFICATE|REQUEST|CRL|PARAMETERS|PKCS7|CMS|SIGNATURE)'
description = "PEM block type label (EC PRIVATE KEY, CERTIFICATE REQUEST)"

[[value.not_secret]]
pattern = '-----(?:BEGIN|END) [A-Z0-9 ]+-----(?:\s|\\[nr])*'
description = "PEM armor line with no body"

[[value.not_secret]]
pattern = '(?i)[\w.-]+\.(?:key|pem|crt|cer|csr|der|p8|p12|pfx|jks|keystore|pub|kdbx|asc|gpg)'
description = "key or certificate file name (sa.key, tls.crt)"

[[value.not_secret]]
pattern = '(?:~|\.{1,2})?/[\w.\-/]*'
description = "filesystem path (/etc/kubernetes/pki/sa.key, ./certs, ~/.ssh/id_rsa)"

[[value.not_secret]]
pattern = '<[^<>]+>|\*+|(?i:x+)|\$[A-Z_][A-Z0-9_]*|\$\{[^}]*\}|\$\(.*\)'
description = "placeholder (<your-secret-key>, ********, xxxx, $SECRET, ${SECRET}, $(cat key))"

[words]
# Target-name tokens saying the constant describes or locates a secret (SECRET_ENV, TokenName).
# Deliberately not: role (DB_ROLE_PASSWORD), event (WEBHOOK_EVENT_SECRET), metric
# (METRICS_AUTH_TOKEN), each commonly a real credential; kind is too generic.
name_descriptors = ["env", "var", "name", "field", "header", "label", "type", "file", "path", "dir",
                    "prefix", "suffix", "param", "attr", "column", "prop", "annotation"]
# Descriptors only as the leading name token, exact and singular (Go ActionX, PermissionX name an
# authorization object; elsewhere they say where a credential is used: GITHUB_ACTIONS_TOKEN).
leading_descriptors = ["action", "permission"]
# Head nouns that make a credential-named variable metadata about the credential: the last word of
# a compound name is what it denotes (secretKeyAlgorithm = "DESede" names an algorithm).
metadata_heads = ["algorithm", "algorithms", "alg", "algo", "cipher", "transformation", "mode",
                  "length", "size", "bits", "format", "provider", "scheme", "version", "iterations",
                  "spec", "kind"]
# Standard HTTP auth header and scheme names (lowercase, exact match): such a value is a name, not a
# secret, unless the target is password-named ("cookie" or "basic" is a plausible weak password).
http_auth_names = ["authorization", "proxy-authorization", "www-authenticate", "proxy-authenticate",
                   "cookie", "set-cookie", "x-api-key", "x-auth-token", "x-access-token",
                   "x-csrf-token", "x-xsrf-token", "bearer", "basic"]
password_words = ["pass", "password", "passwd", "pwd"]
# Structural words allowed in a value that otherwise echoes the name.
structural_words = ["id", "name", "field", "ref", "data"]
