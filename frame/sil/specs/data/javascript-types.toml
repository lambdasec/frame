# The JavaScript / TypeScript type model: what kind of value an expression is, from the builtins and
# Node's core modules, without running anything. Read by the JS frontend (`_value_kind`) through
# frame/sil/specs/javascript_types.py (strictly). A NoSQL sink is a database-handle method, so a
# receiver this model knows is something else (an array, a string, a hash from `crypto`) is not one.

[modules]
# Node core modules: they hand out hashes, buffers, streams and handles of their own, never a
# database collection (`fs/promises` and other subpaths count as their module).
node_core = ["assert", "async_hooks", "buffer", "child_process", "cluster", "console", "crypto", "dgram", "diagnostics_channel", "dns", "domain", "events", "fs", "fs/promises", "http", "http2", "https", "inspector", "module", "net", "os", "path", "perf_hooks", "process", "punycode", "querystring", "readline", "repl", "stream", "string_decoder", "timers", "tls", "tty", "url", "util", "v8", "vm", "wasi", "worker_threads", "zlib"]
# In-memory collection utilities: their find / remove work on arrays and objects (globs: the
# `lodash.*` per-method packages are lodash).
in_memory = ["lodash", "lodash-es", "lodash/fp", "lodash.*", "ramda", "underscore"]

[methods]
# Array methods returning an array, string methods returning a string (the receiver's own kind).
array_to_array = ["concat", "copyWithin", "fill", "filter", "flat", "flatMap", "map", "reverse", "slice", "sort", "splice", "toReversed", "toSorted", "toSpliced", "with"]
string_to_string = ["charAt", "concat", "normalize", "padEnd", "padStart", "repeat", "replace", "replaceAll", "slice", "substr", "substring", "toLocaleLowerCase", "toLocaleUpperCase", "toLowerCase", "toString", "toUpperCase", "trim", "trimEnd", "trimStart"]

# String methods no database driver or common container shares: the result's kind, whatever the
# receiver is.
[string_only_methods]
split = "Array"
toLowerCase = "String"
toUpperCase = "String"
trim = "String"
trimStart = "String"
trimEnd = "String"
padStart = "String"
padEnd = "String"
charAt = "String"
toLocaleLowerCase = "String"
toLocaleUpperCase = "String"

# `new X(...)` of a global constructor: the kind of value it makes.
[constructors]
Array = "Array"
Map = "Map"
Set = "Set"
WeakMap = "Map"
WeakSet = "Set"
RegExp = "RegExp"
String = "String"
Number = "Number"
Boolean = "Boolean"
Date = "Date"
Promise = "Promise"
Error = "Error"
URL = "URL"
URLSearchParams = "URLSearchParams"
Buffer = "Buffer"

# Global factory calls (`Array.from`, `JSON.parse`): the kind of value they return.
[factories]
"Array.from" = "Array"
"Array.of" = "Array"
"Object.keys" = "Array"
"Object.values" = "Array"
"Object.entries" = "Array"
"Object.assign" = "Object"
"Object.create" = "Object"
"JSON.parse" = "Object"
"Buffer.from" = "Buffer"
"Buffer.alloc" = "Buffer"
"Buffer.concat" = "Buffer"
String = "String"
Number = "Number"

# Array.prototype iteration methods (ECMAScript): the position of the callback parameter that is the
# element's index, a number (`arr.forEach((v, i) => ...)`); on a value known to be an Array only (a
# Map's forEach hands its key there).
[array_index_params]
forEach = 1
map = 1
filter = 1
some = 1
every = 1
find = 1
findIndex = 1
findLast = 1
findLastIndex = 1
flatMap = 1
reduce = 2
reduceRight = 2

# Methods that call the function they are handed (argument 0) with what the receiver holds: an
# Array's elements (ECMAScript Array.prototype iteration methods), a promise's resolved value
# (`then`'s onFulfilled). The position of the callback parameter that receives it (`reduce`'s is
# 1, after the accumulator). Read by the JS frontend (`_callback_value_calls`) only to pass the
# receiver's taint and value origin into that parameter: it never makes a source or a sink, so a
# receiver of another type with a method of the same name costs at most a propagation.
[callback_values]
forEach = 0
map = 0
filter = 0
some = 0
every = 0
find = 0
findIndex = 0
findLast = 0
findLastIndex = 0
flatMap = 0
reduce = 1
reduceRight = 1
then = 0

# Array methods that store their arguments in the receiver (ECMAScript): the first argument
# position whose value becomes an element (`splice(start, count, ...items)`).
[receiver_writes]
push = 0
unshift = 0
splice = 2
