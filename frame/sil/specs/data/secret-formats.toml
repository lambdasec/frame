# Provider credential formats: a string literal anywhere in the code that matches one in full is a
# hardcoded credential (CWE-798), whatever it is assigned to. Only formats specific enough to be
# unambiguous (a fixed, provider-specific prefix and length); test-mode keys and bare JWTs are
# not here (mostly fixtures). `ignore` lists the provider's own published example values.
# Fields: id, provider, pattern (a Python regex, matched with fullmatch against the literal or
# searched within it when `within = true`), description, reference, ignore.

[[format]]
id = "aws-access-key-id"
provider = "AWS"
pattern = '(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}'
description = "AWS access key ID"
reference = "https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html#identifiers-unique-ids"
ignore = ["AKIAIOSFODNN7EXAMPLE"]

[[format]]
id = "github-token"
provider = "GitHub"
pattern = 'gh[pousr]_[A-Za-z0-9]{36,251}'
description = "GitHub token (personal access, OAuth, user-to-server, server-to-server or refresh)"
reference = "https://github.blog/engineering/platform-security/behind-githubs-new-authentication-token-formats/"

[[format]]
id = "github-fine-grained-pat"
provider = "GitHub"
pattern = 'github_pat_[A-Za-z0-9_]{82}'
description = "GitHub fine-grained personal access token"
reference = "https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens"

[[format]]
id = "gitlab-pat"
provider = "GitLab"
pattern = 'glpat-[A-Za-z0-9_-]{20,}'
description = "GitLab personal access token"
reference = "https://docs.gitlab.com/ee/security/tokens/#token-prefixes"

[[format]]
id = "slack-token"
provider = "Slack"
pattern = 'xox[baprs]-[0-9A-Za-z]{8,}-[0-9A-Za-z-]{8,}'
description = "Slack bot, user, app or refresh token"
reference = "https://api.slack.com/authentication/token-types"

[[format]]
id = "slack-webhook"
provider = "Slack"
pattern = 'https://hooks\.slack\.com/services/T[0-9A-Z]{8,}/B[0-9A-Z]{8,}/[0-9A-Za-z]{24}'
within = true
description = "Slack incoming webhook URL"
reference = "https://api.slack.com/messaging/webhooks"

[[format]]
id = "google-api-key"
provider = "Google"
pattern = 'AIza[0-9A-Za-z_-]{35}'
description = "Google API key"
reference = "https://cloud.google.com/docs/authentication/api-keys"

[[format]]
id = "stripe-live-key"
provider = "Stripe"
pattern = '(?:sk|rk)_live_[0-9A-Za-z]{24,}'
description = "Stripe live secret or restricted key"
reference = "https://docs.stripe.com/keys"

[[format]]
id = "openai-api-key"
provider = "OpenAI"
pattern = 'sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{40,}|sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}'
description = "OpenAI API key"
reference = "https://platform.openai.com/docs/api-reference/authentication"

[[format]]
id = "anthropic-api-key"
provider = "Anthropic"
pattern = 'sk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_-]{80,}'
description = "Anthropic API key"
reference = "https://docs.anthropic.com/en/api/overview"

[[format]]
id = "sendgrid-api-key"
provider = "SendGrid"
pattern = 'SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}'
description = "SendGrid API key"
reference = "https://www.twilio.com/docs/sendgrid/ui/account-and-settings/api-keys"

[[format]]
id = "npm-token"
provider = "npm"
pattern = 'npm_[A-Za-z0-9]{36}'
description = "npm access token"
reference = "https://github.blog/changelog/2021-09-23-npm-has-a-new-access-token-format/"

[[format]]
id = "pypi-token"
provider = "PyPI"
pattern = 'pypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,}'
description = "PyPI API token"
reference = "https://pypi.org/help/#apitoken"

[[format]]
id = "huggingface-token"
provider = "Hugging Face"
pattern = 'hf_[A-Za-z]{34}'
description = "Hugging Face access token"
reference = "https://huggingface.co/docs/hub/security-tokens"

[[format]]
id = "digitalocean-token"
provider = "DigitalOcean"
pattern = 'do[por]_v1_[a-f0-9]{64}'
description = "DigitalOcean personal access, OAuth or refresh token"
reference = "https://docs.digitalocean.com/reference/api/create-personal-access-token/"

[[format]]
id = "shopify-token"
provider = "Shopify"
pattern = 'shp(?:at|ca|pa|ss)_[a-fA-F0-9]{32}'
description = "Shopify access token or shared secret"
reference = "https://shopify.dev/docs/apps/build/authentication-authorization/access-tokens"

[[format]]
id = "private-key"
provider = "PEM"
pattern = '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED |PGP )?PRIVATE KEY(?: BLOCK)?-----(?:(?!-----END).){0,512}?[A-Za-z0-9+/]{32,}'
within = true
description = "private key"
reference = "https://www.rfc-editor.org/rfc/rfc7468"
