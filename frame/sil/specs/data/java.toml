# Java library specifications: one [[spec]] per call name, in lookup order,
# with the ProcSpec fields (frame/sil/procedure.py) that differ from their defaults.
# Loaded by frame/sil/specs/tables.py. Edit here; run the benchmark sweep after a change.


# Servlet requests (javax.servlet / jakarta.servlet API): rows on the interface that declares the
# method, reached through a receiver's declared type and its supertypes (java-types.toml
# [supertypes]), never through a variable's name or a bare method name.

# Servlet response output: the writer / stream the response hands out (`response.getWriter()`,
# or a local bound once to it), not every PrintWriter. Keys are the call that made the value.
[[spec]]
name = "Context.lookup"
is_sink = "ldap"
description = "JNDI lookup of a name (CWE-90/JNDI injection)"

