# Algorithm names that are weak wherever an API takes the algorithm by name (Java's
# MessageDigest.getInstance / Cipher.getInstance, Python's hashlib.new). Compared without regard to
# case; how a name is found in the argument (a hash whole, a cipher within the algorithm part of
# "DES/CBC/PKCS5Padding", the mode part) is weak_algorithms.weak_algorithm's; which argument holds
# it is the spec row's `algorithm_name_arg`. Read by frame/sil/specs/weak_algorithms.py.

# Hash functions with practical collisions (CWE-328). "SHA" is the JCA name of SHA-1.
hashes = ["MD2", "MD4", "MD5", "SHA", "SHA1", "SHA-1"]

# Ciphers too weak to keep data confidential (CWE-327).
ciphers = ["DES", "DESEDE", "3DES", "RC2", "RC4", "BLOWFISH"]

# Block cipher modes that leak patterns of the plaintext (CWE-327).
cipher_modes = ["ECB"]

# Windows CryptoAPI algorithm identifiers (ALG_ID constants from wincrypt.h, as Microsoft's
# "ALG_ID" reference names them) -> the algorithm they select. A call whose algorithm argument
# (`algorithm_arg` in the C/C++ spec tables: CryptCreateHash, CryptDeriveKey, CryptGenKey) is one
# of these is weak when the algorithm is in the lists above.
[windows_alg_ids]
CALG_MD2 = "MD2"
CALG_MD4 = "MD4"
CALG_MD5 = "MD5"
CALG_SHA = "SHA"
CALG_SHA1 = "SHA1"
CALG_DES = "DES"
CALG_3DES = "3DES"
CALG_3DES_112 = "3DES"
CALG_RC2 = "RC2"
CALG_RC4 = "RC4"
