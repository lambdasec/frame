# The caller's own credential. A credential header looked up by name in a request's header map
# (`[[request_type]] headers`) is PRINCIPAL-typed, not an attacker-chosen object selector: the
# caller can only present their own credential, so a value scoped by it is self-scoped (it binds
# ownership for IDOR checks; it does not select someone else's object). Read by
# frame/sil/specs/principals.py (the translator).

# Request headers that carry the caller's credential (lower case, exact).
credential_headers = ["authorization", "proxy-authorization", "authentication", "cookie",
                      "x-api-key", "api-key", "apikey", "x-auth-token", "x-access-token",
                      "x-authentication-token", "x-session-token"]

