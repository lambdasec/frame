[[spec]]
name = "stof"
is_sanitizer = ["sql", "command", "shell", "html", "xss", "filesystem", "path", "ldap", "xpath", "eval", "code", "regex", "header", "redirect", "ssrf", "template", "xml", "xxe", "log", "format", "format_string"]
taint_propagates = [0]

[[spec]]
name = "stod"
is_sanitizer = ["sql", "command", "shell", "html", "xss", "filesystem", "path", "ldap", "xpath", "eval", "code", "regex", "header", "redirect", "ssrf", "template", "xml", "xxe", "log", "format", "format_string"]
taint_propagates = [0]

[[spec]]
name = "reallocarray"
allocates = "heap"
may_return_null = true
description = "reallocarray (resize allocation, overflow-checked)"

[[spec]]
name = "mmap"
allocates = "mapped"
description = "mmap (mapped memory; MAP_FAILED, not NULL, on error)"

[[spec]]
name = "cfree"
frees = "heap"
description = "cfree (obsolete alias of free)"

[[spec]]
name = "munmap"
frees = "mapped"
description = "munmap (release mapped memory)"

[[spec]]
name = "wcslen"
dereferences = [0]
taint_propagates = [0]
description = "wcslen() - wide string length"

[[spec]]
name = "_Exit"
noreturn = true
description = "_Exit (never returns)"

[[spec]]
name = "_abort"
noreturn = true
description = "_abort (never returns)"

[[spec]]
name = "__assert_fail"
noreturn = true
description = "__assert_fail (never returns)"

[[spec]]
name = "errx"
noreturn = true
description = "errx (never returns)"
