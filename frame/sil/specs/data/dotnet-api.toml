# .NET library facts the C# frontend reads (frame/sil/specs/dotnet_api.py, strictly). XML parser
# configuration is in parser-hardening.toml [dotnet]; ASP.NET conventions are in the csharp packs.

# Member-access values whose mere reference selects an insecure configuration: a weak hash or cipher
# mode, Json.NET type-name handling (the JSON names the class to create), LDAP binds that send the
# password in cleartext. Each is reported through the spec row of the same name (csharp.toml).
dangerous_values = ["HashAlgorithmName.MD5", "HashAlgorithmName.SHA1", "CipherMode.ECB",
                    "TypeNameHandling.All", "TypeNameHandling.Auto", "TypeNameHandling.Objects",
                    "TypeNameHandling.Arrays", "ContextOptions.SimpleBind", "AuthType.Basic"]

# Types of an HTTP request object: `req.Query` on a variable of one of them reads like `Request.Query`
# (the source rows are written against the conventional property name).
request_types = ["HttpRequest", "HttpRequestBase", "HttpRequestMessage"]

# Methods that hand out an element of their receiver through an `out` argument (a dictionary's
# TryGetValue, IHeaderDictionary / IQueryCollection / IFormCollection.TryGetValue, a concurrent
# collection's TryDequeue): the out variable holds what the receiver holds, never the key.
out_from_receiver = ["TryGetValue", "TryPeek", "TryDequeue", "TryPop", "TryTake", "TryRemove"]

# Members of a collection that read it without changing it (`TABLE.ContainsKey(k)`): a table of
# literals used only through them, element reads and `foreach` stays a table of constants.
read_only_collection_methods = ["Contains", "ContainsKey", "ContainsValue", "TryGetValue", "GetValueOrDefault",
                                "IndexOf", "LastIndexOf", "Count", "Length", "Keys", "Values", "First",
                                "FirstOrDefault", "Last", "LastOrDefault", "Single", "SingleOrDefault",
                                "Any", "All", "ElementAt", "ElementAtOrDefault", "Where", "Select", "ToList",
                                "ToArray", "ToString", "Equals", "GetHashCode", "GetEnumerator"]

# Documented supertypes (simple names): a call on a value of the type is also looked up under each
# supertype's rows, so a row is written once on the type that declares the member. ADO.NET providers'
# commands derive from System.Data.Common.DbCommand (which implements IDbCommand); XmlDocument and
# XmlElement from XmlNode; ASP.NET Core's Controller from ControllerBase; CodeDomProvider's
# compilers; Json.NET's writers from JsonWriter.
[supertypes]
SqlCommand = ["DbCommand"]
NpgsqlCommand = ["DbCommand"]
MySqlCommand = ["DbCommand"]
SqliteCommand = ["DbCommand"]
SQLiteCommand = ["DbCommand"]
OleDbCommand = ["DbCommand"]
OdbcCommand = ["DbCommand"]
OracleCommand = ["DbCommand"]
SqlCeCommand = ["DbCommand"]
DbCommand = ["IDbCommand"]
XmlDocument = ["XmlNode"]
XmlElement = ["XmlNode"]
Controller = ["ControllerBase"]
CSharpCodeProvider = ["CodeDomProvider"]
VBCodeProvider = ["CodeDomProvider"]
JsonTextWriter = ["JsonWriter"]
MemoryStream = ["Stream"]
FileStream = ["Stream"]
BufferedStream = ["Stream"]
NetworkStream = ["Stream"]
GZipStream = ["Stream"]
DeflateStream = ["Stream"]
CryptoStream = ["Stream"]
UnmanagedMemoryStream = ["Stream"]

# Extension methods by the namespace that brings them into scope and the static class that declares
# them: C# binds `x.FromSqlRaw(sql)` to the extension method of that name the file's usings make
# visible (EF Core: RelationalQueryableExtensions, RelationalDatabaseFacadeExtensions).
[extension_methods."Microsoft.EntityFrameworkCore"]
FromSqlRaw = "RelationalQueryableExtensions"
FromSql = "RelationalQueryableExtensions"
ExecuteSqlRaw = "RelationalDatabaseFacadeExtensions"
ExecuteSqlRawAsync = "RelationalDatabaseFacadeExtensions"
ExecuteSqlCommand = "RelationalDatabaseFacadeExtensions"
ExecuteSqlCommandAsync = "RelationalDatabaseFacadeExtensions"
SqlQueryRaw = "RelationalDatabaseFacadeExtensions"
FromSqlInterpolated = "RelationalQueryableExtensions"
ExecuteSqlInterpolated = "RelationalDatabaseFacadeExtensions"
ToListAsync = "EntityFrameworkQueryableExtensions"

# LINQ (System.Linq.Enumerable; IQueryable's Queryable has the same names and the same flow).
[extension_methods."System.Linq"]
Where = "Enumerable"
Select = "Enumerable"
FirstOrDefault = "Enumerable"
SingleOrDefault = "Enumerable"
ToList = "Enumerable"

# Collection methods that store their arguments in the receiver (System.Collections.Generic and the
# concurrent collections): after `list.Add(q)` the collection holds q. By the receiver's declared type
# (simple name, with its [supertypes]) and method, the argument positions stored.
[stores_arguments]
List = { Add = [0], AddRange = [0], Insert = [1], InsertRange = [1] }
IList = { Add = [0], Insert = [1] }
ICollection = { Add = [0] }
HashSet = { Add = [0], UnionWith = [0] }
ISet = { Add = [0], UnionWith = [0] }
SortedSet = { Add = [0], UnionWith = [0] }
LinkedList = { AddFirst = [0], AddLast = [0], AddBefore = [1], AddAfter = [1] }
Queue = { Enqueue = [0] }
Stack = { Push = [0] }
Dictionary = { Add = [0, 1], TryAdd = [0, 1] }
IDictionary = { Add = [0, 1] }
SortedDictionary = { Add = [0, 1] }
SortedList = { Add = [0, 1] }
ConcurrentDictionary = { TryAdd = [0, 1], AddOrUpdate = [0, 1, 2], GetOrAdd = [0, 1] }
ConcurrentQueue = { Enqueue = [0] }
ConcurrentStack = { Push = [0], PushRange = [0] }
ConcurrentBag = { Add = [0] }
BlockingCollection = { Add = [0], TryAdd = [0] }
NameValueCollection = { Add = [0, 1], Set = [0, 1] }
ArrayList = { Add = [0], AddRange = [0], Insert = [1] }
Hashtable = { Add = [0, 1] }

# Constructors with an overload that reads a stream: given a value of one of `types` at `arg` (what
# `Request.Body` or `IFormFile.OpenReadStream()` is), the row's path sink does not apply (a Stream
# names no file). Simple type names, compared with their [supertypes].
[stream_overloads]
StreamReader = { arg = 0, types = ["Stream"] }
StreamWriter = { arg = 0, types = ["Stream"] }
BinaryReader = { arg = 0, types = ["Stream"] }
BinaryWriter = { arg = 0, types = ["Stream"] }

# Members that install a TLS server-certificate validation callback (ServicePointManager,
# HttpClientHandler, HttpWebRequest), and the built-in validator that accepts every certificate.
[certificate_callbacks]
members = ["ServerCertificateValidationCallback", "ServerCertificateCustomValidationCallback"]
accept_all = ["DangerousAcceptAnyServerCertificateValidator"]

# Asymmetric providers whose first constructor argument is the key size in bits; below `minimum`
# is too small (NIST SP 800-131A: RSA / DSA keys of at least 2048 bits).
[key_size]
types = ["RSACryptoServiceProvider", "DSACryptoServiceProvider", "RSACng", "DSACng"]
minimum = 2048


# Properties that are a sink only on one declared type (`FileName` elsewhere is just a name). With
# `when`, only if the same object initializer sets `property` to a literal containing `contains`
# (`new ContentResult { Content = x, ContentType = "text/html" }`; the default is text/plain).
[[typed_property_sink]]
type = "DbCommand"
property = "CommandText"
kind = "sql"

[[typed_property_sink]]
type = "IDbCommand"
property = "CommandText"
kind = "sql"

[[typed_property_sink]]
type = "SqlOperation"
property = "Sql"
kind = "sql"

# EF6 migrations (System.Data.Entity.Migrations.Sql.MigrationStatement.Sql): the statement's SQL text.
[[typed_property_sink]]
type = "MigrationStatement"
property = "Sql"
kind = "sql"

[[typed_property_sink]]
type = "HtmlContainerControl"
property = "InnerHtml"
kind = "html"

[[typed_property_sink]]
type = "HtmlGenericControl"
property = "InnerHtml"
kind = "html"

[[typed_property_sink]]
type = "ProcessStartInfo"
property = "FileName"
kind = "command"

[[typed_property_sink]]
type = "ProcessStartInfo"
property = "Arguments"
kind = "command"

[[typed_property_sink]]
type = "DirectorySearcher"
property = "Filter"
kind = "ldap"

[[typed_property_sink]]
type = "ContentResult"
property = "Content"
kind = "html"
when = { property = "ContentType", contains = "html" }
