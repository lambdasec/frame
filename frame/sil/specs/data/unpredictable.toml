# Arguments whose value must be unpredictable: a session or remember-me token set as a cookie, a
# cryptographic key, IV, nonce or salt. Output of a non-cryptographic PRNG (`weak_random`:
# java.util.Random, Python's `random`, JS `Math.random`) reaching one is CWE-338; anywhere else a
# random number is not a finding. C/C++ declare theirs in c_specs (`EVP_*Init*`, HMAC, PBKDF2,
# `Set-Cookie` headers). Matched by canonical id, else by the trailing names of the call
# (`set_cookie` matches `resp.set_cookie`). Fields: language, call (canonical ids), names, args
# (positions), kwargs (keyword names), description.

[[call]]
language = "java"
call = ["javax.servlet.http.Cookie.<init>", "jakarta.servlet.http.Cookie.<init>"]
names = ["new javax.servlet.http.Cookie", "new jakarta.servlet.http.Cookie", "new Cookie"]
args = [1]
description = "a cookie's value"

[[call]]
language = "java"
names = ["new SecretKeySpec", "new javax.crypto.spec.SecretKeySpec"]
args = [0]
description = "a secret key's bytes"

[[call]]
language = "java"
names = ["new IvParameterSpec", "new javax.crypto.spec.IvParameterSpec"]
args = [0]
description = "a cipher IV"

[[call]]
language = "java"
names = ["new GCMParameterSpec", "new javax.crypto.spec.GCMParameterSpec"]
args = [1]
description = "a GCM nonce"

[[call]]
language = "java"
names = ["new PBEKeySpec", "new javax.crypto.spec.PBEKeySpec"]
args = [1]
description = "a password-hashing salt"

[[call]]
language = "python"
names = ["set_cookie"]
args = [1]
kwargs = ["value"]
description = "a cookie's value"

[[call]]
language = "python"
call = ["hmac.new"]
args = [0]
kwargs = ["key"]
description = "an HMAC key"

[[call]]
language = "python"
call = ["hashlib.pbkdf2_hmac"]
args = [2]
kwargs = ["salt"]
description = "a password-hashing salt"

[[call]]
language = "python"
call = ["Crypto.Cipher.AES.new", "Cryptodome.Cipher.AES.new"]
args = [0]
kwargs = ["key", "iv", "nonce"]
description = "a cipher key, IV or nonce"

[[call]]
language = "javascript"
call = ["express.Response.cookie", "fastify.FastifyReply.setCookie", "koa.Context.cookies.set",
        "next.NextApiResponse.cookie", "sails.Response.cookie"]   # by the response's origin (the framework packs)
args = [1]
description = "a cookie's value"

[[call]]
language = "javascript"
call = ["crypto.createHmac"]
args = [1]
description = "an HMAC key"

[[call]]
language = "javascript"
call = ["crypto.createCipheriv", "crypto.createDecipheriv"]
args = [1, 2]
description = "a cipher key or IV"

[[call]]
language = "javascript"
call = ["crypto.pbkdf2", "crypto.pbkdf2Sync", "crypto.scrypt", "crypto.scryptSync"]
args = [1]
description = "a password-hashing salt"

# Destinations whose NAME says the value must be unpredictable: a variable, field or buffer a
# weak_random value is written into, or a function whose result (return value, or a write into
# one of its parameters: a C out-parameter has no name but the function's) is one. A name is split
# into words (camelCase and separators, lower case); an entry matches consecutive words. A name
# whose last word is a metadata head of secret-names.toml (`token_length`, `salt_size`) names
# something about the value, not the value. Bare "key" and "id" are not here: a dictionary key and
# a row id are not secrets.
[destinations]
words = ["token", "secret", "password", "passwd", "passphrase", "nonce", "salt", "otp", "csrf",
         "sessionid", "session id", "session key", "api key", "private key", "signing key",
         "access key", "encryption key", "crypto key", "auth key", "iv"]
