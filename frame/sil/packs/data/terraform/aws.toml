# AWS resources in Terraform (hashicorp/aws provider). Attribute names and defaults are the
# provider's (registry.terraform.io/providers/hashicorp/aws/latest/docs); what a setting means
# is AWS's. `internet(c)`: some address in CIDR c can send from the internet (IANA's
# special-purpose registries, decided with Z3: frame/iac/addresses.py).

[pack]
name = "aws"
language = "terraform"
description = "AWS: network exposure, public databases, unencrypted storage"
references = ["https://registry.terraform.io/providers/hashicorp/aws/latest/docs"]

# --- security group rules, in the three ways Terraform writes them -------------------------
# aws_security_group `ingress` blocks and aws_security_group_rule: protocol, from_port, to_port,
# cidr_blocks, ipv6_cidr_blocks. aws_vpc_security_group_ingress_rule: ip_protocol, from_port,
# to_port, cidr_ipv4, cidr_ipv6. Protocol "-1" (or "all") is every protocol and every port; AWS
# takes a protocol number or name, and a number written without quotes is the same value.

[[define]]
name = "all_traffic"
params = ["p"]
body = '''p in ["-1", "all", -1]'''

[[define]]
name = "tcp_port"
params = ["p", "from", "to", "port"]
body = '''all_traffic(p) or (p in ["tcp", "6", 6] and from <= port and to >= port)'''

[[define]]
name = "every_tcp_port"
params = ["p", "from", "to"]
body = '''all_traffic(p) or (p in ["tcp", "6", 6] and from <= 0 and to >= 65535)'''

[[define]]
name = "rule_from_internet"
params = ["r"]
body = '''(some c in r.cidr_blocks: internet(c, 4)) or (some c in r.ipv6_cidr_blocks: internet(c, 6))'''

[[define]]
name = "vpc_rule_from_internet"
params = ["r"]
body = '''internet(r.cidr_ipv4, 4) or internet(r.cidr_ipv6, 6)'''

[[policy]]
id = "aws-sg-admin-from-internet"
title = "Security group lets the internet reach SSH or RDP"
severity = "high"
cwe = "CWE-284"
resources = ["aws_security_group", "aws_security_group_rule", "aws_vpc_security_group_ingress_rule"]
when = '''
(some r in self.ingress: rule_from_internet(r)
    and (tcp_port(r.protocol, r.from_port, r.to_port, 22) or tcp_port(r.protocol, r.from_port, r.to_port, 3389)))
or (self.type == "ingress" and rule_from_internet(self)
    and (tcp_port(self.protocol, self.from_port, self.to_port, 22)
         or tcp_port(self.protocol, self.from_port, self.to_port, 3389)))
or (vpc_rule_from_internet(self)
    and (tcp_port(self.ip_protocol, self.from_port, self.to_port, 22)
         or tcp_port(self.ip_protocol, self.from_port, self.to_port, 3389)))
'''
references = ["https://docs.aws.amazon.com/securityhub/latest/userguide/ec2-controls.html#ec2-53",
              "https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html"]

[[policy]]
id = "aws-sg-all-from-internet"
title = "Security group lets the internet reach every port"
severity = "high"
cwe = "CWE-284"
resources = ["aws_security_group", "aws_security_group_rule", "aws_vpc_security_group_ingress_rule"]
overrides = ["aws-sg-admin-from-internet"]
when = '''
(some r in self.ingress: rule_from_internet(r) and every_tcp_port(r.protocol, r.from_port, r.to_port))
or (self.type == "ingress" and rule_from_internet(self)
    and every_tcp_port(self.protocol, self.from_port, self.to_port))
or (vpc_rule_from_internet(self) and every_tcp_port(self.ip_protocol, self.from_port, self.to_port))
'''
references = ["https://docs.aws.amazon.com/securityhub/latest/userguide/ec2-controls.html#ec2-18",
              "https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html"]

# --- databases -----------------------------------------------------------------------------

[[policy]]
id = "aws-rds-public"
title = "Database instance has a public endpoint"
severity = "high"
cwe = "CWE-284"
resources = ["aws_db_instance", "aws_rds_cluster_instance"]
when = '''self.publicly_accessible == true'''
references = ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html#USER_VPC.Hiding"]

# --- storage the configuration leaves unencrypted --------------------------------------------
# A volume from a snapshot, or a database restored or replicated from another, takes its
# source's encryption, which the files do not show; so does an account-wide default set
# outside this configuration.

[[policy]]
id = "aws-ebs-unencrypted"
title = "EBS volume is not encrypted by this configuration"
severity = "low"
cwe = "CWE-311"
resources = ["aws_ebs_volume"]
when = '''
default(self.encrypted, false) == false and absent(self.snapshot_id)
and not (some d in resources["aws_ebs_encryption_by_default"]: default(d.enabled, true) == true)
'''
references = ["https://docs.aws.amazon.com/ebs/latest/userguide/ebs-encryption.html"]

[[policy]]
id = "aws-rds-unencrypted"
title = "Database storage is not encrypted by this configuration"
severity = "low"
cwe = "CWE-311"
resources = ["aws_db_instance"]
when = '''
default(self.storage_encrypted, false) == false
and absent(self.snapshot_identifier) and absent(self.replicate_source_db)
'''
references = ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html"]

# --- S3: a bucket the public can read or write ---------------------------------------------
# Since April 2023 every new bucket has all four Block Public Access settings on and ACLs
# disabled (Object Ownership "bucket owner enforced"), however it is created:
#   https://aws.amazon.com/about-aws/whats-new/2022/12/amazon-s3-automatically-enable-block-public-access-disable-access-control-lists-buckets-april-2023/
# So a public ACL takes effect only when this configuration enables ACLs
# (aws_s3_bucket_ownership_controls: ObjectWriter or BucketOwnerPreferred) and turns
# block_public_acls and ignore_public_acls off (aws_s3_bucket_public_access_block, whose
# arguments default to false); a public bucket policy only when it turns block_public_policy and
# restrict_public_buckets off. An aws_s3_account_public_access_block in the configuration with
# the matching setting on blocks it for every bucket. Settings made outside these files (an
# account or organization setting) can block it too; they are not in the files.
# "Public" for a policy is AWS's definition (frame/iac/aws_policy.py: `policy_public`).

[[define]]
name = "for_bucket"
params = ["ref", "b"]
body = '''ref == b.id or ref == b.bucket'''

[[define]]
name = "public_acl"
params = ["b"]
body = '''
b.acl in ["public-read", "public-read-write", "authenticated-read"]
or (some a in resources["aws_s3_bucket_acl"]: for_bucket(a.bucket, b) and (
    a.acl in ["public-read", "public-read-write", "authenticated-read"]
    or (some p in a.access_control_policy: some g in p.grant: some e in g.grantee:
        e.uri in ["http://acs.amazonaws.com/groups/global/AllUsers",
                  "http://acs.amazonaws.com/groups/global/AuthenticatedUsers"])))
'''

[[define]]
name = "acls_enabled"
params = ["b"]
body = '''
some o in resources["aws_s3_bucket_ownership_controls"]: for_bucket(o.bucket, b)
    and (some r in o.rule: r.object_ownership in ["ObjectWriter", "BucketOwnerPreferred"])
'''

[[define]]
name = "acls_unblocked"
params = ["b"]
body = '''
(some p in resources["aws_s3_bucket_public_access_block"]: for_bucket(p.bucket, b)
    and default(p.block_public_acls, false) == false and default(p.ignore_public_acls, false) == false)
and not (some a in resources["aws_s3_account_public_access_block"]:
    default(a.block_public_acls, false) == true or default(a.ignore_public_acls, false) == true)
'''

[[define]]
name = "public_policy"
params = ["b"]
body = '''
b.policy_public == true
or (some p in resources["aws_s3_bucket_policy"]: for_bucket(p.bucket, b) and p.policy_public == true)
'''

[[define]]
name = "policies_unblocked"
params = ["b"]
body = '''
(some p in resources["aws_s3_bucket_public_access_block"]: for_bucket(p.bucket, b)
    and default(p.block_public_policy, false) == false and default(p.restrict_public_buckets, false) == false)
and not (some a in resources["aws_s3_account_public_access_block"]:
    default(a.block_public_policy, false) == true or default(a.restrict_public_buckets, false) == true)
'''

[[policy]]
id = "aws-s3-public"
title = "S3 bucket is open to the public (an ACL or bucket policy that takes effect)"
severity = "high"
cwe = "CWE-732"
resources = ["aws_s3_bucket"]
when = '''
(public_acl(self) and acls_enabled(self) and acls_unblocked(self))
or (public_policy(self) and policies_unblocked(self))
'''
references = ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html",
              "https://docs.aws.amazon.com/AmazonS3/latest/userguide/about-object-ownership.html"]

# --- IAM ---------------------------------------------------------------------------------

[[policy]]
id = "aws-iam-full-admin"
title = "IAM policy allows every action on every resource"
severity = "high"
cwe = "CWE-269"
resources = ["aws_iam_policy", "aws_iam_role_policy", "aws_iam_user_policy", "aws_iam_group_policy", "aws_iam_role"]
when = '''self.policy_admin == true or (some p in self.inline_policy: p.policy_admin == true)'''
references = ["https://docs.aws.amazon.com/securityhub/latest/userguide/iam-controls.html#iam-1"]

# --- network reachability -----------------------------------------------------------------
# frame/iac/aws_network.py decides, for each instance, whether some internet address can
# reach the port through its public address, its subnet's route to an internet gateway
# (longest prefix match), the subnet's network ACL both ways, and its security groups.

[[policy]]
id = "aws-ec2-admin-reachable"
title = "The internet can reach SSH or RDP on this instance"
severity = "critical"
cwe = "CWE-284"
resources = ["aws_instance"]
when = '''self.internet_reach.ssh == true or self.internet_reach.rdp == true'''
references = ["https://docs.aws.amazon.com/vpc/latest/userguide/route-tables-priority.html",
              "https://docs.aws.amazon.com/vpc/latest/userguide/nacl-rules.html",
              "https://docs.aws.amazon.com/vpc/latest/userguide/subnet-route-tables.html"]
