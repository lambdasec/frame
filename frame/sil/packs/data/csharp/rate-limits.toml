[pack]
name = "rate-limits"
language = "csharp"
description = "Rate limiters that limit how often a caller can try a guess (the hunt's attempt_limit check)"

# ASP.NET Core rate limiting: `[EnableRateLimiting("policy")]` on a controller or action,
# `.RequireRateLimiting("policy")` on a minimal-API endpoint, `[DisableRateLimiting]` to take one
# out, and `app.UseRateLimiter()`, which also enforces a GlobalLimiter for every endpoint.
# https://learn.microsoft.com/en-us/aspnet/core/performance/rate-limit
[[rate_limit]]
call = ["Microsoft.AspNetCore.RateLimiting.EnableRateLimitingAttribute", "Microsoft.AspNetCore.RateLimiting.EnableRateLimiting"]
kind = "decorator"

[[rate_limit]]
call = ["Microsoft.AspNetCore.RateLimiting.DisableRateLimitingAttribute", "Microsoft.AspNetCore.RateLimiting.DisableRateLimiting"]
kind = "exempt"

[[rate_limit]]
name = ["RequireRateLimiting"]
kind = "middleware"

[[rate_limit]]
name = ["UseRateLimiter"]
kind = "global"

# AspNetCoreRateLimit: IP / client rate limiting middleware for every endpoint.
# https://github.com/stefanprodan/AspNetCoreRateLimit/wiki/IpRateLimitMiddleware
[[rate_limit]]
name = ["UseIpRateLimiting", "UseClientRateLimiting"]
kind = "global"

# ASP.NET Identity: a sign-in counts a failed password towards the account's lockout only when
# `lockoutOnFailure` is true (PasswordSignInAsync(user | userName, password, isPersistent,
# lockoutOnFailure), CheckPasswordSignInAsync(user, password, lockoutOnFailure)); an application
# that checks with UserManager counts a failure itself with AccessFailedAsync. The lockout then
# applies with IdentityOptions.Lockout (enabled for new users, 5 failures, by default).
# https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.identity.signinmanager-1.passwordsigninasync
# https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.identity.signinmanager-1.checkpasswordsigninasync
# https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.identity.usermanager-1.accessfailedasync
[[rate_limit]]
call = ["Microsoft.AspNetCore.Identity.SignInManager.PasswordSignInAsync"]
kind = "call"
when_arg = { position = 3, name = "lockoutOnFailure", value = true }

[[rate_limit]]
call = ["Microsoft.AspNetCore.Identity.SignInManager.CheckPasswordSignInAsync"]
kind = "call"
when_arg = { position = 2, name = "lockoutOnFailure", value = true }

[[rate_limit]]
call = ["Microsoft.AspNetCore.Identity.UserManager.AccessFailedAsync"]
kind = "call"
