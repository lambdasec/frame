[pack]
name = "aspnetcore"
language = "csharp"
description = "ASP.NET Core MVC / Web API controllers, Razor Pages, SignalR hubs and the framework's response helpers"
detect = { imports = ["Microsoft.AspNetCore"] }

# MVC / Web API: a controller action's model-bound parameters (route, query, form, header, body)
# are attacker data. The built-in rule covers classes whose name contains "Controller"; this one
# follows the base class, so `class Orders : ControllerBase` and `class Api : Controller` count too.
[[entrypoint]]
id = "mvc-action"
extends = ["ControllerBase", "Controller", "Microsoft.AspNetCore.Mvc.ControllerBase",
           "Microsoft.AspNetCore.Mvc.Controller"]
annotation = ["Http*", "Route", "AcceptVerbs", "Microsoft.AspNetCore.Mvc.Http*"]
params = "all"
exclude_param_type = ["ILogger<*>", "CancellationToken", "*Context", "*Service", "*Repository",
                      "int", "long", "short", "byte", "bool", "double", "float", "decimal", "char", "Guid",
                      "DateTime", "DateTimeOffset", "TimeSpan", "int?", "long?", "bool?", "Guid?", "DateTime?"]

# Conventional actions: ASP.NET Core treats a class as a controller when its name ends in
# "Controller", it derives from such a class, or it carries [Controller]; every public, non-static
# method of it is an action unless marked [NonAction], and its parameters are model-bound from the
# request (learn.microsoft.com/aspnet/core/mvc/controllers/actions).
[[entrypoint]]
id = "mvc-conventional-action"
class_name = ["*Controller"]
method = ["*"]
exclude_method = ["ctor"]                 # a constructor's parameters are injected services
modifiers = ["public"]
exclude_modifiers = ["static"]
exclude_decorator = ["NonAction", "NonActionAttribute", "Microsoft.AspNetCore.Mvc.NonAction*"]
params = "all"
exclude_param_type = ["ILogger<*>", "CancellationToken", "*Context", "*Service", "*Repository",
                      "int", "long", "short", "byte", "bool", "double", "float", "decimal", "char", "Guid",
                      "DateTime", "DateTimeOffset", "TimeSpan", "int?", "long?", "bool?", "Guid?", "DateTime?"]

[[entrypoint]]
id = "mvc-derived-controller-action"
extends = ["*Controller", "Microsoft.AspNetCore.Mvc.ControllerBase", "Microsoft.AspNetCore.Mvc.Controller"]
method = ["*"]
exclude_method = ["ctor"]                 # a constructor's parameters are injected services
modifiers = ["public"]
exclude_modifiers = ["static"]
exclude_decorator = ["NonAction", "NonActionAttribute", "Microsoft.AspNetCore.Mvc.NonAction*"]
params = "all"
exclude_param_type = ["ILogger<*>", "CancellationToken", "*Context", "*Service", "*Repository",
                      "int", "long", "short", "byte", "bool", "double", "float", "decimal", "char", "Guid",
                      "DateTime", "DateTimeOffset", "TimeSpan", "int?", "long?", "bool?", "Guid?", "DateTime?"]

[[entrypoint]]
id = "mvc-attributed-controller-action"
class_decorator = ["Controller", "ControllerAttribute", "ApiController", "Microsoft.AspNetCore.Mvc.Controller*",
                   "Microsoft.AspNetCore.Mvc.ApiController*"]
method = ["*"]
exclude_method = ["ctor"]                 # a constructor's parameters are injected services
modifiers = ["public"]
exclude_modifiers = ["static"]
exclude_decorator = ["NonAction", "NonActionAttribute", "Microsoft.AspNetCore.Mvc.NonAction*"]
params = "all"
exclude_param_type = ["ILogger<*>", "CancellationToken", "*Context", "*Service", "*Repository",
                      "int", "long", "short", "byte", "bool", "double", "float", "decimal", "char", "Guid",
                      "DateTime", "DateTimeOffset", "TimeSpan", "int?", "long?", "bool?", "Guid?", "DateTime?"]

# Explicit binding attributes are attacker data wherever they appear (any class: model binding
# fills a [From*] parameter whatever the controller derives from, POCO controllers included).
[[entrypoint]]
id = "mvc-bound-parameter"
method = ["*"]
params = "annotated"
param_annotation = ["FromQuery", "FromRoute", "FromBody", "FromForm", "FromHeader",
                    "Microsoft.AspNetCore.Mvc.From*"]

# Razor Pages: handler methods (OnGet, OnPostLogin, OnGetExport...) take route / query / form values as
# parameters, and [BindProperty] / [From*] properties are filled from the request before the handler runs.
[[entrypoint]]
id = "razor-page-handler"
extends = ["PageModel", "Microsoft.AspNetCore.Mvc.RazorPages.PageModel"]
method = ["On[A-Z]*"]
params = "all"
fields = "annotated"
field_annotation = ["BindProperty*", "From*", "TempData*", "*.BindProperty*", "*.From*", "*.TempData*"]
exclude_param_type = ["ILogger<*>", "CancellationToken", "*Context", "*Service", "*Repository",
                      "int", "long", "short", "byte", "bool", "double", "float", "decimal", "char", "Guid",
                      "DateTime", "DateTimeOffset", "TimeSpan", "int?", "long?", "bool?", "Guid?", "DateTime?"]

# [BindProperties] on a page model binds every public settable property.
[[entrypoint]]
id = "razor-page-bind-properties"
extends = ["PageModel", "Microsoft.AspNetCore.Mvc.RazorPages.PageModel"]
class_annotation = ["BindProperties*", "*.BindProperties*"]
method = ["On[A-Z]*"]
fields = "settable"

# SignalR: every public hub method is invoked by a remote client with the arguments it chose.
[[entrypoint]]
id = "signalr-hub-method"
extends = ["Hub", "Hub<*>", "DynamicHub", "Microsoft.AspNetCore.SignalR.Hub", "Microsoft.AspNetCore.SignalR.Hub<*>"]
method = ["*"]
params = "all"
exclude_param_type = ["Exception", "CancellationToken", "int", "long", "short", "byte", "bool", "double", "float",
                      "decimal", "char", "Guid", "DateTime", "DateTimeOffset", "TimeSpan"]

# Blazor components: [Parameter] / [SupplyParameterFromQuery] / [CascadingParameter] properties are set from
# the URL, the query string or a parent component, before the lifecycle methods run.
[[entrypoint]]
id = "blazor-component"
extends = ["ComponentBase", "Microsoft.AspNetCore.Components.ComponentBase", "LayoutComponentBase"]
method = ["*"]
fields = "annotated"
field_annotation = ["Parameter*", "SupplyParameterFrom*", "CascadingParameter*",
                    "*.Parameter*", "*.SupplyParameterFrom*", "*.CascadingParameter*"]

# Request reads that are method calls (the property forms Request.Query[..], Request.Cookies[..] are built in).
[[source]]
name = ["Request.ReadFormAsync", "Request.ReadFromJsonAsync", "request.ReadFormAsync", "request.ReadFromJsonAsync",
        "req.ReadFormAsync", "req.ReadFromJsonAsync"]
kind = "user_input"

# Response helpers whose argument is a file-system path.
[[sink]]
name = ["PhysicalFile", "Results.PhysicalFile", "TypedResults.PhysicalFile"]
kind = "filesystem"
description = "serves the file at the given path"

[[sink]]
name = ["RedirectPermanent", "RedirectPreserveMethod", "RedirectPermanentPreserveMethod",
        "Results.Redirect", "TypedResults.Redirect"]
kind = "redirect"

[[sink]]
name = ["Results.Content", "TypedResults.Content"]
kind = "html"

[[sink]]
name = ["NavigationManager.NavigateTo", "Navigation.NavigateTo", "NavigationManager.NavigateToLogin"]
kind = "redirect"
description = "Blazor navigation to a caller-chosen URL"

[[sink]]
name = ["MarkupString"]
kind = "html"
description = "MarkupString renders its text as raw HTML"

# The framework's own output encoders and URL checks.
[[sanitizer]]
name = ["HtmlEncoder.Default.Encode", "Html.Encode", "WebUtility.HtmlEncode", "HttpUtility.HtmlEncode"]
kinds = ["xss"]

[[sanitizer]]
name = ["Url.IsLocalUrl", "Url.Content"]
kinds = ["redirect"]

# CORS: AllowAnyOrigin() on a policy lets any site call the API with the user's credentials.
[[sink]]
name = ["AllowAnyOrigin"]
args = []
kind = "cors"
description = "CORS policy that allows any origin"
