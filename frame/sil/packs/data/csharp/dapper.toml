[pack]
name = "dapper"
language = "csharp"
description = "Dapper: Query / Execute extension methods on an IDbConnection take SQL text"
detect = { imports = ["Dapper"] }

# The SQL text is argument 0; the parameters object (`new { id }`) is the safe way to pass values.
# Dapper's methods (Dapper.SqlMapper) extend IDbConnection, so they are called on a connection: the
# interface, the DbConnection base, or an ADO.NET provider's connection class, by declared type
# (never a type merely named like one: a SignalR HubConnection is not a database).
# Dapper's Query* / Execute* (Query, QueryFirstOrDefaultAsync, Execute, ExecuteScalar, ExecuteReader...).
[[sink]]
call = ["System.Data.IDbConnection.Query*", "System.Data.IDbConnection.Execute*",
        "System.Data.Common.DbConnection.Query*", "System.Data.Common.DbConnection.Execute*",
        "System.Data.SqlClient.SqlConnection.Query*", "System.Data.SqlClient.SqlConnection.Execute*",
        "Microsoft.Data.SqlClient.SqlConnection.Query*", "Microsoft.Data.SqlClient.SqlConnection.Execute*",
        "Npgsql.NpgsqlConnection.Query*", "Npgsql.NpgsqlConnection.Execute*",
        "MySql.Data.MySqlClient.MySqlConnection.Query*", "MySql.Data.MySqlClient.MySqlConnection.Execute*",
        "MySqlConnector.MySqlConnection.Query*", "MySqlConnector.MySqlConnection.Execute*",
        "Microsoft.Data.Sqlite.SqliteConnection.Query*", "Microsoft.Data.Sqlite.SqliteConnection.Execute*",
        "System.Data.SQLite.SQLiteConnection.Query*", "System.Data.SQLite.SQLiteConnection.Execute*",
        "Oracle.ManagedDataAccess.Client.OracleConnection.Query*", "Oracle.ManagedDataAccess.Client.OracleConnection.Execute*",
        "System.Data.OleDb.OleDbConnection.Query*", "System.Data.OleDb.OleDbConnection.Execute*",
        "System.Data.Odbc.OdbcConnection.Query*", "System.Data.Odbc.OdbcConnection.Execute*",
        "Dapper.SqlMapper.Query", "Dapper.SqlMapper.QueryAsync"]
kind = "sql"
description = "Dapper query / execute: the first argument is SQL text"
