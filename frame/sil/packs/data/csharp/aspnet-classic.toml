[pack]
name = "aspnet-classic"
language = "csharp"
description = "System.Web: ASP.NET WebForms code-behind, MVC 5 and Web API 2 controllers, HttpContext.Current"
detect = { imports = ["System.Web"] }

# MVC 5 / Web API 2: public actions bind route, query and body values to their parameters.
[[entrypoint]]
id = "mvc5-action"
extends = ["Controller", "ApiController", "System.Web.Mvc.Controller", "System.Web.Http.ApiController"]
method = ["*"]
params = "all"
exclude_param_type = ["CancellationToken", "*Context", "*Service", "*Repository",
                      "int", "long", "short", "byte", "bool", "double", "float", "decimal", "char", "Guid",
                      "DateTime", "DateTimeOffset", "TimeSpan", "int?", "long?", "bool?", "Guid?", "DateTime?"]

# NameValueCollection reads (the indexer forms `Request.QueryString["x"]` are built in).
[[source]]
name = ["Request.QueryString.Get", "Request.QueryString.GetValues", "Request.Form.Get", "Request.Form.GetValues",
        "Request.Params.Get", "Request.Params.GetValues", "Request.Headers.Get", "Request.Headers.GetValues",
        "Request.Cookies.Get", "Request.ServerVariables.Get"]
kind = "user_input"

[[sink]]
name = ["Response.TransmitFile", "Response.WriteFile"]
kind = "filesystem"
description = "sends the file at the given path"

[[sink]]
name = ["Response.AppendHeader", "Response.AddHeader"]
args = [1]
kind = "header_injection"

[[sink]]
name = ["Response.Output.Write", "Response.Output.WriteLine"]
kind = "html"

[[sanitizer]]
name = ["Server.HtmlEncode", "HttpUtility.HtmlEncode", "HttpUtility.HtmlAttributeEncode", "AntiXssEncoder.HtmlEncode",
        "Microsoft.Security.Application.Encoder.HtmlEncode", "Encoder.HtmlEncode"]
kinds = ["xss"]

[[sanitizer]]
name = ["Server.UrlEncode", "HttpUtility.UrlEncode"]
kinds = ["xss", "redirect"]

# ASP.NET MVC 5 / Web API 2 conventional controllers: the controller factory takes a class whose
# name ends in "Controller" (the base may sit in another file: `CallbackController : BaseController`);
# its public, non-static methods are actions unless [NonAction], their parameters model-bound.
[[entrypoint]]
id = "mvc5-conventional-action"
class_name = ["*Controller"]
method = ["*"]
exclude_method = ["ctor"]
modifiers = ["public"]
exclude_modifiers = ["static"]
exclude_decorator = ["NonAction", "NonActionAttribute", "System.Web.Mvc.NonAction*", "System.Web.Http.NonAction*"]
params = "all"
exclude_param_type = ["CancellationToken", "*Context", "*Service", "*Repository",
                      "int", "long", "short", "byte", "bool", "double", "float", "decimal", "char", "Guid",
                      "DateTime", "DateTimeOffset", "TimeSpan", "int?", "long?", "bool?", "Guid?", "DateTime?"]

# ASMX web services: a [WebMethod] of a System.Web.Services.WebService takes the SOAP request's values.
[[entrypoint]]
id = "asmx-web-method"
annotation = ["WebMethod", "WebMethodAttribute", "System.Web.Services.WebMethod*"]
params = "all"
exclude_param_type = ["CancellationToken", "int", "long", "short", "byte", "bool", "double", "float", "decimal",
                      "char", "Guid", "DateTime", "DateTimeOffset", "TimeSpan"]

# Microsoft.WebSockets (Microsoft.Web.WebSockets.WebSocketHandler): OnMessage receives the client's message.
[[entrypoint]]
id = "websocket-handler-message"
extends = ["WebSocketHandler", "Microsoft.Web.WebSockets.WebSocketHandler"]
method = ["OnMessage"]
params = "all"

# System.Web.HttpCookie with Secure / HttpOnly explicitly off.
[[setting]]
id = "httpcookie-secure-off"
kind = "cookie_secure"
at = "member"
receiver = ["HttpCookie", "System.Web.HttpCookie"]
keys = ["Secure"]
value = false
description = "cookie without Secure"

[[setting]]
id = "httpcookie-httponly-off"
kind = "cookie_httponly"
at = "member"
receiver = ["HttpCookie", "System.Web.HttpCookie"]
keys = ["HttpOnly"]
value = false
description = "cookie without HttpOnly"

# System.Web.Mvc UrlHelper.IsLocalUrl: the same check in MVC 5.
[[same_origin_check]]
name = ["IsLocalUrl"]
