[pack]
name = "entity-framework"
language = "csharp"
description = "EF Core raw SQL APIs that take a string"
detect = { imports = ["Microsoft.EntityFrameworkCore"] }

# FromSqlRaw / ExecuteSqlRaw are built in. SqlQueryRaw (EF Core 7+) runs the text as given;
# SqlQuery / FromSqlInterpolated / ExecuteSqlInterpolated take a FormattableString and parameterise.
# On a context's Database (a DatabaseFacade; the project's DbContext subclass inherits `Database`).
[[sink]]
call = ["Microsoft.EntityFrameworkCore.Infrastructure.DatabaseFacade.SqlQueryRaw",
        "Microsoft.EntityFrameworkCore.DbContext.Database.SqlQueryRaw"]
kind = "sql"
description = "EF Core raw SQL query: the first argument is SQL text"

# SaveChanges writes every tracked change; Add / Update / Remove (and their Range forms) on the
# context stage a write. A marker that the code writes stored data (read by the business-logic
# hunt), never a taint sink or a finding.
# https://learn.microsoft.com/en-us/ef/core/saving/basic
[[sink]]
call = ["Microsoft.EntityFrameworkCore.DbContext.SaveChanges", "Microsoft.EntityFrameworkCore.DbContext.SaveChangesAsync",
        "Microsoft.EntityFrameworkCore.DbContext.Add", "Microsoft.EntityFrameworkCore.DbContext.AddAsync",
        "Microsoft.EntityFrameworkCore.DbContext.AddRange", "Microsoft.EntityFrameworkCore.DbContext.AddRangeAsync",
        "Microsoft.EntityFrameworkCore.DbContext.Update", "Microsoft.EntityFrameworkCore.DbContext.UpdateRange",
        "Microsoft.EntityFrameworkCore.DbContext.Remove", "Microsoft.EntityFrameworkCore.DbContext.RemoveRange"]
kind = "resource_modify"
description = "EF Core write"

# A property marked as a concurrency token (`[ConcurrencyCheck]`, a `[Timestamp]` row version) makes
# SaveChanges fail with DbUpdateConcurrencyException when the row changed since it was read: an
# optimistic lock on the entity. Matched on the fields of the entities a write saves.
# https://learn.microsoft.com/en-us/ef/core/saving/concurrency
[[concurrency]]
call = ["System.ComponentModel.DataAnnotations.ConcurrencyCheckAttribute",
        "System.ComponentModel.DataAnnotations.TimestampAttribute"]
kind = "version"

# The same token configured in code (the fluent API): `modelBuilder.Entity<Product>().Property(p =>
# p.Version).IsRowVersion()` in `OnModelCreating`, or `builder.Property(c => c.Rev)
# .IsConcurrencyToken()` in an `IEntityTypeConfiguration<Coupon>`'s `Configure(EntityTypeBuilder<Coupon>
# builder)`. The entity is the chain's type argument, else the builder's.
# https://learn.microsoft.com/en-us/ef/core/saving/concurrency#configuring-concurrency-tokens
[[concurrency]]
call = ["Microsoft.EntityFrameworkCore.ModelBuilder.Entity.**.IsConcurrencyToken",
        "Microsoft.EntityFrameworkCore.ModelBuilder.Entity.**.IsRowVersion",
        "Microsoft.EntityFrameworkCore.Metadata.Builders.EntityTypeBuilder.**.IsConcurrencyToken",
        "Microsoft.EntityFrameworkCore.Metadata.Builders.EntityTypeBuilder.**.IsRowVersion"]
kind = "version"

# SaveChanges saves every change the context tracks on the entities it loaded: a property assigned
# on an entity read earlier (`item.Product.Stock = item.Product.Stock - n`) is written there.
# https://learn.microsoft.com/en-us/ef/core/change-tracking/
[[concurrency]]
call = ["Microsoft.EntityFrameworkCore.DbContext.SaveChanges", "Microsoft.EntityFrameworkCore.DbContext.SaveChangesAsync"]
kind = "write"
tracked = true

# Reading entities through a DbSet, for the read-then-write check only (never taint sinks).
# https://learn.microsoft.com/en-us/ef/core/querying/
[[concurrency]]
call = ["Microsoft.EntityFrameworkCore.DbSet.Find", "Microsoft.EntityFrameworkCore.DbSet.FindAsync",
        "Microsoft.EntityFrameworkCore.DbSet.First*", "Microsoft.EntityFrameworkCore.DbSet.Single*",
        "Microsoft.EntityFrameworkCore.DbSet.Last*", "Microsoft.EntityFrameworkCore.DbSet.Where",
        "Microsoft.EntityFrameworkCore.DbSet.Any*", "Microsoft.EntityFrameworkCore.DbSet.Count*",
        "Microsoft.EntityFrameworkCore.DbSet.ToList*", "Microsoft.EntityFrameworkCore.DbSet.Include",
        "Microsoft.EntityFrameworkCore.DbSet.AsQueryable", "Microsoft.EntityFrameworkCore.DbSet.AsNoTracking",
        "Microsoft.EntityFrameworkCore.DbSet.Select"]
kind = "read"

# `ExecuteUpdate` / `ExecuteDelete` run one UPDATE / DELETE in the database (EF Core 7+): a
# `Where` testing a column a `SetProperty` changes is a compare-and-set, and a `SetProperty` whose
# value reads its own column (`x => x.Stock - 1`) is computed by the database.
# https://learn.microsoft.com/en-us/ef/core/saving/execute-insert-update-delete
[[concurrency]]
call = ["Microsoft.EntityFrameworkCore.DbSet.**.ExecuteUpdate", "Microsoft.EntityFrameworkCore.DbSet.**.ExecuteUpdateAsync",
        "Microsoft.EntityFrameworkCore.DbSet.ExecuteUpdate", "Microsoft.EntityFrameworkCore.DbSet.ExecuteUpdateAsync"]
kind = "write"
filter = [".Where"]
update = [".SetProperty"]

[[concurrency]]
call = ["Microsoft.EntityFrameworkCore.DbSet.**.ExecuteDelete", "Microsoft.EntityFrameworkCore.DbSet.**.ExecuteDeleteAsync",
        "Microsoft.EntityFrameworkCore.DbSet.ExecuteDelete", "Microsoft.EntityFrameworkCore.DbSet.ExecuteDeleteAsync"]
kind = "write"
