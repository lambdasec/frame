[pack]
name = "entity-framework6"
language = "csharp"
description = "Entity Framework 6 (System.Data.Entity) raw SQL"
detect = { imports = ["System.Data.Entity"] }

# Database.SqlQuery<T>(sql, params) and DbSet.SqlQuery(sql, params) take a plain string in EF6.
# On a context's Database (System.Data.Entity.Database) or a DbSet.
[[sink]]
call = ["System.Data.Entity.Database.SqlQuery", "System.Data.Entity.DbContext.Database.SqlQuery",
        "System.Data.Entity.DbSet.SqlQuery", "System.Data.Entity.DbSet`1.SqlQuery"]
kind = "sql"
description = "EF6 raw SQL query: the first argument is SQL text"
