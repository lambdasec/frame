[pack]
name = "electron"
language = "javascript"
description = "Electron main process: IPC messages from renderers, shell / window navigation sinks"
detect = { imports = ["electron"] }

# A renderer (and anything running in it: remote content, an XSS) can send any argument.
# ipcMain.on / once / handle / handleOnce / addListener(channel, (event, ...args) => ...): the
# event is the main process's own object; the arguments are what the renderer sent
# (https://www.electronjs.org/docs/latest/api/ipc-main).
[[entrypoint]]
id = "ipc-main"
registered_via = ["electron.ipcMain.on", "electron.ipcMain.once", "electron.ipcMain.handle",
                  "electron.ipcMain.handleOnce", "electron.ipcMain.addListener"]
params = "all"
params_from = 1
description = "IPC message from a renderer process"

# A handler's event (an IpcMainEvent / IpcMainInvokeEvent): its `sender` is the renderer's
# WebContents.
[[callback_param]]
registered_via = ["electron.ipcMain.on", "electron.ipcMain.once", "electron.ipcMain.handle",
                  "electron.ipcMain.handleOnce", "electron.ipcMain.addListener"]
position = 0
origin = "electron.IpcMainEvent"

[[sink]]
call = ["electron.shell.openExternal"]
args = [0]
kind = "command"
description = "shell.openExternal hands the URL to the OS (file://, custom protocols: code execution)"

[[sink]]
call = ["electron.shell.openPath"]
args = [0]
kind = "command"
description = "shell.openPath opens / executes the file"

# A window's (or its WebContents') loadURL navigates it to the URL
# (https://www.electronjs.org/docs/latest/api/browser-window, .../web-contents).
[[sink]]
call = ["electron.BrowserWindow.loadURL", "electron.WebContents.loadURL", "electron.BrowserView.webContents.loadURL"]
args = [0]
kind = "redirect"
description = "loadURL navigates the window to the URL"

[[sink]]
call = ["electron.WebContents.executeJavaScript", "electron.webFrame.executeJavaScript",
        "electron.WebFrameMain.executeJavaScript"]
args = [0]
kind = "code"
description = "runs JavaScript in the page"
