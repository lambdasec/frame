[pack]
name = "typeorm"
language = "javascript"
description = "TypeORM and MikroORM raw queries, TypeORM QueryBuilder string fragments"
detect = { imports = ["typeorm", "@nestjs/typeorm", "@mikro-orm/core", "@mikro-orm/postgresql", "@mikro-orm/mysql",
                      "@mikro-orm/mariadb", "@mikro-orm/sqlite", "@mikro-orm/knex"] }
references = ["https://typeorm.io/docs/working-with-entity-manager/entity-manager-api/",
              "https://typeorm.io/docs/query-builder/select-query-builder/",
              "https://mikro-orm.io/docs/query-builder#running-native-sql-query"]

# Raw SQL on the values TypeORM hands out (specs/data/value-types.toml): a DataSource, its
# EntityManager, a Repository, a QueryRunner. Nest injects them by declared type
# (`@InjectRepository(User) private repo: Repository<User>`), which types the field.
[[sink]]
call = ["typeorm.DataSource.query", "typeorm.EntityManager.query", "typeorm.Repository.query",
        "typeorm.QueryRunner.query"]
args = [0]
kind = "sql"
description = "TypeORM raw SQL"

# createQueryBuilder().where("a.name = '" + x + "'"): the clause text is SQL; named parameters
# (`:name`) with a parameters object are the safe form.
[[sink]]
call = ["typeorm.SelectQueryBuilder.where", "typeorm.SelectQueryBuilder.andWhere",
        "typeorm.SelectQueryBuilder.orWhere", "typeorm.SelectQueryBuilder.having",
        "typeorm.SelectQueryBuilder.andHaving", "typeorm.SelectQueryBuilder.orHaving",
        "typeorm.SelectQueryBuilder.orderBy", "typeorm.SelectQueryBuilder.addOrderBy",
        "typeorm.SelectQueryBuilder.groupBy", "typeorm.SelectQueryBuilder.addGroupBy"]
args = [0]
kind = "sql"
description = "TypeORM QueryBuilder clause (string is SQL text)"

# MikroORM's SQL drivers: em.execute(sql) runs native SQL.
[[sink]]
call = ["@mikro-orm/*.EntityManager.execute", "@mikro-orm/*.SqlEntityManager.execute"]
args = [0]
kind = "sql"
description = "MikroORM native SQL"

# DataSource.transaction / EntityManager.transaction call back with the transaction's
# EntityManager, after an optional isolation level (typeorm.io/docs/advanced-topics/transactions).
[[callback_param]]
registered_via = ["typeorm.DataSource.transaction", "typeorm.EntityManager.transaction"]
position = 0
origin = "typeorm.EntityManager"

# A Repository's / EntityManager's writes change stored rows. A marker that the code writes stored
# data (the business-logic hunt's `race`, `limits`, `replay` classes and the service-layer list
# read it), never a taint sink and never a finding by itself.
# https://typeorm.io/docs/working-with-entity-manager/repository-api/
[[sink]]
call = ["typeorm.Repository.save", "typeorm.Repository.insert", "typeorm.Repository.update",
        "typeorm.Repository.upsert", "typeorm.Repository.delete", "typeorm.Repository.remove",
        "typeorm.Repository.softDelete", "typeorm.Repository.softRemove", "typeorm.Repository.restore",
        "typeorm.Repository.increment", "typeorm.Repository.decrement",
        "typeorm.EntityManager.save", "typeorm.EntityManager.insert", "typeorm.EntityManager.update",
        "typeorm.EntityManager.upsert", "typeorm.EntityManager.delete", "typeorm.EntityManager.remove",
        "typeorm.EntityManager.softDelete", "typeorm.EntityManager.softRemove",
        "typeorm.EntityManager.restore", "typeorm.EntityManager.increment",
        "typeorm.EntityManager.decrement"]
kind = "resource_modify"
description = "TypeORM write"

# A read-then-write is safe when the row is locked first (`setLock("pessimistic_write")` on a
# query builder) or the database computes the new value (`increment` / `decrement`).
# https://typeorm.io/docs/query-builder/select-query-builder/#lock-modes
# https://typeorm.io/docs/working-with-entity-manager/repository-api/
[[concurrency]]
call = ["typeorm.SelectQueryBuilder.setLock"]
kind = "lock"

[[concurrency]]
call = ["typeorm.Repository.increment", "typeorm.Repository.decrement",
        "typeorm.EntityManager.increment", "typeorm.EntityManager.decrement"]
kind = "atomic"

# Calls that read stored rows: for the read-then-write check only, never a taint sink.
# https://typeorm.io/docs/working-with-entity-manager/find-options/
[[concurrency]]
call = ["typeorm.Repository.find*", "typeorm.Repository.count*", "typeorm.Repository.exist*",
        "typeorm.EntityManager.find*", "typeorm.EntityManager.count*",
        "typeorm.SelectQueryBuilder.getOne*", "typeorm.SelectQueryBuilder.getMany*",
        "typeorm.SelectQueryBuilder.getCount", "typeorm.SelectQueryBuilder.getRawOne",
        "typeorm.SelectQueryBuilder.getRawMany"]
kind = "read"
