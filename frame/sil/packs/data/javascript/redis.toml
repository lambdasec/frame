[pack]
name = "redis"
language = "javascript"
description = "Redis clients: EVAL runs a Lua script"
detect = { imports = ["redis", "ioredis", "@redis/client", "@upstash/redis", "node-redis", "redis-om"] }

# The clients (value-types.toml): node-redis `createClient()`, ioredis `new Redis()` / `new
# Redis.Cluster()`, Upstash `new Redis()`; EVAL / EVALSHA run a Lua script server side.
[[sink]]
call = ["redis.RedisClient.eval", "redis.RedisClient.evalSha", "redis.RedisClient.EVAL", "redis.RedisClient.EVALSHA",
        "ioredis.eval", "ioredis.evalsha", "ioredis.Cluster.eval", "ioredis.Cluster.evalsha",
        "ioredis.Redis.eval", "ioredis.Redis.evalsha", "@upstash/redis.Redis.eval", "@upstash/redis.Redis.evalsha"]
args = [0]
kind = "code"
description = "Redis EVAL: the first argument is a Lua script"
