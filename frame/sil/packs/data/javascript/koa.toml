[pack]
name = "koa"
language = "javascript"
description = "Koa middleware and @koa/router / koa-router handlers, and what their context holds"
detect = { imports = ["koa", "@koa/router", "koa-router", "koa-bodyparser", "@koa/bodyparser", "koa-body"] }
references = ["https://koajs.com/#context", "https://koajs.com/#request", "https://github.com/koajs/router/blob/master/API.md",
              "https://github.com/koajs/bodyparser", "https://github.com/koajs/koa-body"]

# A middleware is (ctx, next). What the context holds that the client chose: the request's URL
# parts, headers and parsed body (ctx.request.body / files from koa-bodyparser and koa-body), the
# route params (@koa/router), the cookies' values (ctx.cookies.get), and the Node request behind it.
# Everything else is server state: ctx.state, ctx.session, ctx.app, and ctx.body (the response).
[[request_type]]
id = "context"
fields = ["query", "querystring", "path", "url", "originalUrl", "href", "host", "hostname", "header", "headers",
          "params", "request.body", "request.files", "request.query", "request.querystring", "request.path",
          "request.url", "request.originalUrl", "request.href", "request.host", "request.hostname",
          "request.header", "request.headers", "req.headers", "req.url", "req.rawHeaders"]
methods = ["get", "request.get", "cookies.get"]
kinds = { "request.files" = "file" }

# app.use(middleware) on a new Koa(); router.get / post / put / patch / del / delete / all / head /
# options / use(path, middleware...) on a new Router().
[[entrypoint]]
id = "middleware"
registered_via = ["koa.use", "@koa/router.get", "@koa/router.post", "@koa/router.put", "@koa/router.patch", "@koa/router.del", "@koa/router.delete", "@koa/router.all", "@koa/router.head", "@koa/router.options", "@koa/router.use", "koa-router.get", "koa-router.post", "koa-router.put", "koa-router.patch", "koa-router.del", "koa-router.delete", "koa-router.all", "koa-router.head", "koa-router.options", "koa-router.use"]
param_positions = [0]
params = "all"
request_type = "context"
description = "the context of a Koa middleware or route"

# router.param(name, (value, ctx, next) => ...): the route parameter's value and the context.
[[entrypoint]]
id = "param-middleware"
registered_via = ["@koa/router.param", "koa-router.param"]
param_positions = [1]
params = "all"
request_type = "context"
description = "the context of a router.param middleware"

[[entrypoint]]
id = "param-value"
registered_via = ["@koa/router.param", "koa-router.param"]
param_positions = [0]
params = "all"
description = "the route parameter value a router.param middleware receives"

[[sink]]
call = ["koa-send", "koa-send.default", "@koa/send"]
args = [1]
kind = "path"
description = "koa-send serves the file at the given path"

# The context is the response too (https://koajs.com/#response): an origin for the calls and
# properties on it below.
[[entrypoint]]
id = "middleware-context"
registered_via = ["koa.use", "@koa/router.get", "@koa/router.post", "@koa/router.put", "@koa/router.patch", "@koa/router.del", "@koa/router.delete", "@koa/router.all", "@koa/router.head", "@koa/router.options", "@koa/router.use", "koa-router.get", "koa-router.post", "koa-router.put", "koa-router.patch", "koa-router.del", "koa-router.delete", "koa-router.all", "koa-router.head", "koa-router.options", "koa-router.use"]
param_positions = [0]
params = "all"
origin = "koa.Context"
description = "the context of a Koa middleware or route, as the response"

[[entrypoint]]
id = "param-middleware-context"
registered_via = ["@koa/router.param", "koa-router.param"]
param_positions = [1]
params = "all"
origin = "koa.Context"
description = "the context of a router.param middleware, as the response"

[[sink]]
call = ["koa.Context.redirect", "koa.Context.response.redirect"]
args = [0]
kind = "redirect"
description = "Koa ctx.redirect (open redirect)"

[[sink]]
call = ["koa.Context.set", "koa.Context.append", "koa.Context.response.set", "koa.Context.response.append"]
args = [1]
kind = "header"
description = "Koa response header value"

[[sink]]
call = ["koa.Context.attachment", "koa.Context.response.attachment"]
args = [0]
kind = "header"
description = "Koa Content-Disposition filename"

# ctx.body = x is the response body (assigning the property is the sink)
[[sink]]
call = ["koa.Context.body", "koa.Context.response.body"]
property = true
kind = "html"
json_for_literals = true      # an object or array is serialised as JSON
description = "Koa response body (XSS)"
