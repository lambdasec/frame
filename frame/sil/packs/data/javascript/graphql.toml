[pack]
name = "graphql"
language = "javascript"
description = "GraphQL resolvers (Apollo Server, graphql-tools, graphql-yoga, mercurius): args are attacker data"

# Resolver maps (Apollo Server, graphql-tools, graphql-yoga, mercurius): the functions under the root
# operation types, and every type's field resolvers inside an object named `resolvers` (or
# `userResolvers`...), are resolvers.
[[registration]]
id = "resolver-map"
keys = ["Query", "Mutation", "Subscription"]
containers = ["*resolvers"]
registered_as = "graphql.resolver"

# A resolver is called as (parent, args, context, info) (graphql-js, GraphQLFieldResolver): the
# client's input is `args`, the second parameter, however it is named or destructured.
[[entrypoint]]
id = "resolver-args"
registered_via = ["graphql.resolver"]
params = "all"
param_positions = [1]
description = "GraphQL resolver arguments"
