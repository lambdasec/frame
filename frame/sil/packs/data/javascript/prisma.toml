[pack]
name = "prisma"
language = "javascript"
description = "Prisma Client raw queries"
detect = { imports = ["@prisma/client"] }
references = ["https://www.prisma.io/docs/orm/prisma-client/using-raw-sql/raw-queries"]

# `$queryRawUnsafe` / `$executeRawUnsafe` take the SQL as a string (the tagged-template
# `$queryRaw` / `$executeRaw` parameterise their substitutions), and `Prisma.raw` makes a
# fragment of unescaped SQL. The client is `new PrismaClient()` (also behind `$extends`), usually
# exported by a project module (`lib/prisma.js`) that the importers' calls are typed through.
[[sink]]
call = ["@prisma/client.PrismaClient.$queryRawUnsafe", "@prisma/client.PrismaClient.$executeRawUnsafe",
        "@prisma/client.Prisma.raw"]
args = [0]
kind = "sql"
description = "Prisma raw SQL"

# A model delegate's writes (`prisma.user.update(...)`) change stored rows: a marker that the code
# writes stored data (read by the business-logic hunt), never a taint sink or a finding.
# https://www.prisma.io/docs/orm/reference/prisma-client-reference#model-queries
[[sink]]
call = ["@prisma/client.PrismaClient.*.create", "@prisma/client.PrismaClient.*.createMany",
        "@prisma/client.PrismaClient.*.createManyAndReturn", "@prisma/client.PrismaClient.*.update",
        "@prisma/client.PrismaClient.*.updateMany", "@prisma/client.PrismaClient.*.updateManyAndReturn",
        "@prisma/client.PrismaClient.*.upsert", "@prisma/client.PrismaClient.*.delete",
        "@prisma/client.PrismaClient.*.deleteMany"]
kind = "resource_modify"
description = "Prisma model write"

# An update the database applies to the stored value (`data: { stock: { decrement: 1 } }`, an
# atomic number operation) cannot lose a concurrent request's change.
# https://www.prisma.io/docs/orm/reference/prisma-client-reference#atomic-number-operations
[[concurrency]]
call = ["@prisma/client.PrismaClient.*.update", "@prisma/client.PrismaClient.*.updateMany",
        "@prisma/client.PrismaClient.*.updateManyAndReturn", "@prisma/client.PrismaClient.*.upsert"]
keys = ["increment", "decrement", "multiply", "divide"]
kind = "atomic"

# Calls that read stored rows: for the read-then-write check only, never a taint sink.
# https://www.prisma.io/docs/orm/reference/prisma-client-reference#model-queries
[[concurrency]]
call = ["@prisma/client.PrismaClient.*.findUnique", "@prisma/client.PrismaClient.*.findUniqueOrThrow",
        "@prisma/client.PrismaClient.*.findFirst", "@prisma/client.PrismaClient.*.findFirstOrThrow",
        "@prisma/client.PrismaClient.*.findMany", "@prisma/client.PrismaClient.*.count",
        "@prisma/client.PrismaClient.*.aggregate", "@prisma/client.PrismaClient.*.groupBy"]
kind = "read"

# A write that states in `where` a field its `data` (or an upsert's `update`) changes is a
# compare-and-set the database checks on the row it writes
# (`updateMany({ where: { id, uses: { lt: max } }, data: { uses: { increment: 1 } } })`).
# https://www.prisma.io/docs/orm/reference/prisma-client-reference#updatemany
[[concurrency]]
call = ["@prisma/client.PrismaClient.*.update", "@prisma/client.PrismaClient.*.updateMany",
        "@prisma/client.PrismaClient.*.updateManyAndReturn", "@prisma/client.PrismaClient.*.upsert"]
kind = "write"
filter = ["where"]
update = ["data", "update"]

# Raw statements, for the read-then-write check only: their SQL text is read (a SELECT ... FOR
# UPDATE locks the rows it returns). The tagged-template forms parameterise their substitutions.
# https://www.prisma.io/docs/orm/prisma-client/using-raw-sql/raw-queries
[[concurrency]]
call = ["@prisma/client.PrismaClient.$queryRaw", "@prisma/client.PrismaClient.$executeRaw",
        "@prisma/client.PrismaClient.$queryRawUnsafe", "@prisma/client.PrismaClient.$executeRawUnsafe"]
kind = "read"
statement = true

# An interactive transaction hands its callback a client that queries like the one it came from.
# https://www.prisma.io/docs/orm/prisma-client/queries/transactions#interactive-transactions
[[callback_param]]
registered_via = ["@prisma/client.PrismaClient.$transaction"]
position = 0
origin = "@prisma/client.PrismaClient"
