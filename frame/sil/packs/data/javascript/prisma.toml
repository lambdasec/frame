[pack]
name = "prisma"
language = "javascript"
description = "Prisma Client raw queries"
detect = { imports = ["@prisma/client"] }
references = ["https://www.prisma.io/docs/orm/prisma-client/using-raw-sql/raw-queries"]

# `$queryRawUnsafe` / `$executeRawUnsafe` take the SQL as a string (the tagged-template
# `$queryRaw` / `$executeRaw` parameterise their substitutions), and `Prisma.raw` makes a
# fragment of unescaped SQL. The client is `new PrismaClient()` (also behind `$extends`), usually
# exported by a project module (`lib/prisma.js`) that the importers' calls are typed through.
[[sink]]
call = ["@prisma/client.PrismaClient.$queryRawUnsafe", "@prisma/client.PrismaClient.$executeRawUnsafe",
        "@prisma/client.Prisma.raw"]
args = [0]
kind = "sql"
description = "Prisma raw SQL"

# A model delegate's writes (`prisma.user.update(...)`) change stored rows: a marker that the code
# writes stored data (read by the business-logic hunt), never a taint sink or a finding.
# https://www.prisma.io/docs/orm/reference/prisma-client-reference#model-queries
[[sink]]
call = ["@prisma/client.PrismaClient.*.create", "@prisma/client.PrismaClient.*.createMany",
        "@prisma/client.PrismaClient.*.createManyAndReturn", "@prisma/client.PrismaClient.*.update",
        "@prisma/client.PrismaClient.*.updateMany", "@prisma/client.PrismaClient.*.updateManyAndReturn",
        "@prisma/client.PrismaClient.*.upsert", "@prisma/client.PrismaClient.*.delete",
        "@prisma/client.PrismaClient.*.deleteMany"]
kind = "resource_modify"
description = "Prisma model write"
