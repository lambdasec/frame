[pack]
name = "sails"
language = "javascript"
description = "Sails.js: controller actions and their request, native queries (Sails provides a global, so a Sails app is known by its package.json)"
detect = { dependencies = ["sails"] }
# Sails exposes the app as the global `sails` (https://sailsjs.com/documentation/reference/application).
globals = { sails = "sails" }
references = ["https://sailsjs.com/documentation/concepts/actions-and-controllers",
              "https://sailsjs.com/documentation/reference/request-req",
              "https://sailsjs.com/documentation/reference/waterline-orm/datastores/send-native-query"]

# What a Sails request holds that the client chose (an Express request underneath): the URL
# parts, headers, body, cookies; req.param() / allParams() merge the route, query and body
# parameters; req.file() is an upload stream. Everything else (session, me, options) is server
# state.
[[request_type]]
id = "request"
fields = ["body", "cookies", "headers", "hostname", "originalUrl", "params", "path", "query", "subdomains", "url"]
methods = ["allParams", "file", "get", "param"]

# Actions live in api/controllers/: a controller module's exported actions take (req, res); an
# actions2 module exports `fn: async function (inputs, exits)`, its inputs the request's.
[[entrypoint]]
id = "controller-action"
module_path = ["**/api/controllers/**"]
exports = ["*"]
exclude_method = ["fn"]
param_positions = [0]
params = "all"
request_type = "request"
description = "the request of a Sails controller action"

[[entrypoint]]
id = "actions2-inputs"
module_path = ["**/api/controllers/**"]
exports = ["fn"]
param_positions = [0]
params = "all"
description = "the inputs of a Sails actions2 action"

# The default datastore's (`sails.sendNativeQuery`) and a named one's (`sails.getDatastore(name)`).
[[sink]]
call = ["sails.sendNativeQuery", "sails.Datastore.sendNativeQuery"]
args = [0]
kind = "sql"
description = "Waterline native SQL query"

# Controller actions are (req, res): the response (https://sailsjs.com/documentation/reference/response-res).
[[entrypoint]]
id = "controller-action-response"
module_path = ["**/api/controllers/**"]
exports = ["*"]
exclude_method = ["fn"]
param_positions = [1]
params = "all"
origin = "sails.Response"
description = "the response of a Sails controller action"

[[sink]]
call = ["sails.Response.send"]
args = [0]
kind = "html"
json_for_literals = true      # an object or array is serialised as JSON
description = "Sails res.send (XSS)"

[[sink]]
call = ["sails.Response.write", "sails.Response.end"]
args = [0]
kind = "html"
description = "Sails response write / end"

[[sink]]
call = ["sails.Response.redirect"]
args = [0]
kind = "redirect"
description = "Sails res.redirect (open redirect)"

[[sink]]
call = ["sails.Response.set", "sails.Response.setHeader"]
args = [1]
kind = "header"
description = "Sails response header"
