[pack]
name = "credential-storage"
language = "javascript"
description = "Hash and key-derivation functions: a stored credential replaced by its digest"
detect = { imports = ["crypto", "node:crypto", "bcrypt", "bcryptjs", "argon2", "@node-rs/argon2", "@node-rs/bcrypt"] }
references = ["https://nodejs.org/api/crypto.html", "https://github.com/kelektiv/node.bcrypt.js#api",
              "https://github.com/ranisalt/node-argon2#usage"]

# A digest, MAC or password hash of a credential is what a credential column should hold: the
# credential itself is not recoverable from it (how strong a hash is for a password is CWE-916).
# Node's Hash / Hmac take the data through `update` (the digest is read from what they hold).
[[sanitizer]]
call = ["crypto.createHash.update", "crypto.createHmac.update", "node:crypto.createHash.update",
        "node:crypto.createHmac.update", "crypto.pbkdf2Sync", "crypto.scryptSync", "crypto.hash",
        "node:crypto.pbkdf2Sync", "node:crypto.scryptSync", "node:crypto.hash",
        "bcrypt.hash", "bcrypt.hashSync", "bcryptjs.hash", "bcryptjs.hashSync", "argon2.hash",
        "@node-rs/argon2.hash", "@node-rs/argon2.hashSync", "@node-rs/bcrypt.hash", "@node-rs/bcrypt.hashSync"]
kinds = ["password"]
