[pack]
name = "nextjs"
language = "javascript"
description = "Next.js: pages/api routes, app-router route handlers, server actions, data fetching, page props"
detect = { imports = ["next"], dependencies = ["next"] }
references = ["https://nextjs.org/docs/pages/building-your-application/routing/api-routes",
              "https://nextjs.org/docs/app/building-your-application/routing/route-handlers",
              "https://nextjs.org/docs/app/api-reference/functions/next-request",
              "https://nextjs.org/docs/pages/building-your-application/data-fetching/get-server-side-props",
              "https://nextjs.org/docs/app/api-reference/file-conventions/page",
              "https://react.dev/reference/rsc/use-server"]

# pages/api/**: the default export is the request handler, (req, res) with req a Node
# IncomingMessage plus Next.js's query, cookies and body.
[[request_type]]
id = "api-request"
fields = ["query", "cookies", "body", "headers", "rawHeaders", "url"]

[[entrypoint]]
id = "api-route"
module_path = ["**/pages/api/**"]
exports = ["default"]
param_positions = [0]
params = "all"
request_type = "api-request"
description = "the request of a pages/api route"

# app/**/route.js: `export async function GET(request, { params })`; the request is a Web
# Request (NextRequest): its URL, headers, cookies and body; the second argument's params are
# the dynamic route segments.
[[request_type]]
id = "route-request"
fields = ["url", "nextUrl.pathname", "nextUrl.search", "nextUrl.searchParams", "nextUrl.href", "headers",
          "cookies", "body"]
methods = ["json", "text", "formData", "arrayBuffer", "blob"]

[[request_type]]
id = "route-context"
fields = ["params"]

[[entrypoint]]
id = "route-handler"
module_path = ["**/app/**/route.*"]
exports = ["GET", "POST", "PUT", "PATCH", "DELETE", "HEAD", "OPTIONS"]
param_positions = [0]
params = "all"
request_type = "route-request"
description = "the request of an app-router route handler"

[[entrypoint]]
id = "route-handler-params"
module_path = ["**/app/**/route.*"]
exports = ["GET", "POST", "PUT", "PATCH", "DELETE", "HEAD", "OPTIONS"]
param_positions = [1]
params = "all"
request_type = "route-context"
description = "the dynamic route segments of an app-router route handler"

# Server actions: the exports of a 'use server' module, or a function whose body says so; every
# argument is what the browser posted.
[[entrypoint]]
id = "server-action"
directives = ["use server"]
exports = ["*"]
params = "all"
description = "the arguments of a server action (a 'use server' module's exports)"

[[entrypoint]]
id = "inline-server-action"
body_directives = ["use server"]
params = "all"
description = "the arguments of a function that is a server action ('use server' in its body)"

# getServerSideProps(context) / getInitialProps(ctx): the URL's params and query, and the Node
# request behind it.
[[request_type]]
id = "page-context"
fields = ["params", "query", "resolvedUrl", "asPath", "req.headers", "req.cookies", "req.url", "req.rawHeaders"]

[[entrypoint]]
id = "server-side-props"
exports = ["getServerSideProps"]
param_positions = [0]
params = "all"
request_type = "page-context"
description = "the context of getServerSideProps"

[[entrypoint]]
id = "initial-props"
method = ["getInitialProps"]
param_positions = [0]
params = "all"
request_type = "page-context"
description = "the context of getInitialProps"

# app/**/page.js and layout.js: the default export receives { params, searchParams }, and so does
# generateMetadata.
[[request_type]]
id = "page-props"
fields = ["params", "searchParams"]

[[entrypoint]]
id = "page-props"
module_path = ["**/app/**/page.*", "**/app/**/layout.*"]
exports = ["default", "generateMetadata"]
param_positions = [0]
params = "all"
request_type = "page-props"
description = "the route params and search params of an app-router page"

[[source]]
call = ["next/headers.cookies", "next/headers.headers"]
kind = "user_input"
description = "request cookies / headers"

[[sink]]
call = ["next/server.NextResponse.redirect", "next/server.NextResponse.rewrite"]
args = [0]
kind = "redirect"
description = "NextResponse.redirect (open redirect)"

[[sink]]
call = ["next/navigation.redirect", "next/navigation.permanentRedirect"]
args = [0]
kind = "redirect"
description = "next/navigation redirect (open redirect)"

# pages/api handler(req, res): the response, a Node ServerResponse with Next.js's helpers
# (https://nextjs.org/docs/pages/building-your-application/routing/api-routes#response-helpers).
[[entrypoint]]
id = "api-route-response"
module_path = ["**/pages/api/**"]
exports = ["default"]
param_positions = [1]
params = "all"
origin = "next.NextApiResponse"
description = "the response of a pages/api route"

[[sink]]
call = ["next.NextApiResponse.send"]
args = [0]
kind = "html"
json_for_literals = true      # an object or array is serialised as JSON
description = "Next.js res.send (XSS)"

[[sink]]
call = ["next.NextApiResponse.write", "next.NextApiResponse.end"]
args = [0]
kind = "html"
description = "Next.js response write / end"

[[sink]]
call = ["next.NextApiResponse.redirect"]
args = [0, 1]
kind = "redirect"
description = "Next.js res.redirect([status,] url)"

[[sink]]
call = ["next.NextApiResponse.setHeader"]
args = [1]
kind = "header_injection"
description = "Next.js response header"
