[pack]
name = "restify"
language = "javascript"
description = "Restify: handlers registered on a restify.createServer() server, their request object, raw HTML responses"
detect = { imports = ["restify"] }
references = ["http://restify.com/docs/server-api/", "http://restify.com/docs/request-api/",
              "http://restify.com/docs/plugins-api/"]

# What a handler's request holds that the client chose: route params, the parsed query and body
# (queryParser / bodyParser), uploaded files, cookies (restify-cookies), headers and the URL, and
# the Request API's accessors of them.
[[request_type]]
id = "request"
fields = ["params", "query", "body", "files", "cookies", "headers", "rawHeaders", "url"]
methods = ["header", "trailer", "getQuery", "query", "getPath", "path", "href", "getUrl", "userAgent",
           "getContentType", "contentType"]
kinds = { files = "file" }

# server.get / head / post / put / patch / del / opts(path, handler...), server.use / pre(handler):
# a handler is (req, res, next).
[[entrypoint]]
id = "handler"
registered_via = ["restify.createServer.get", "restify.createServer.head", "restify.createServer.post", "restify.createServer.put", "restify.createServer.patch", "restify.createServer.del", "restify.createServer.opts", "restify.createServer.use", "restify.createServer.pre"]
param_positions = [0]
params = "all"
request_type = "request"
description = "the request of a Restify handler"

# handler(req, res, next): the response (http://restify.com/docs/response-api/).
[[entrypoint]]
id = "handler-response"
registered_via = ["restify.createServer.get", "restify.createServer.head", "restify.createServer.post", "restify.createServer.put", "restify.createServer.patch", "restify.createServer.del", "restify.createServer.opts", "restify.createServer.use", "restify.createServer.pre"]
param_positions = [1]
params = "all"
origin = "restify.Response"
description = "the response of a Restify handler"

[[sink]]
call = ["restify.Response.sendRaw"]
args = [0]
kind = "html"
description = "Restify res.sendRaw writes the body without serialising it"

[[sink]]
call = ["restify.Response.write", "restify.Response.end"]
args = [0]
kind = "html"
description = "Restify response write / end"

[[sink]]
call = ["restify.Response.redirect"]
args = [0]
kind = "redirect"
description = "Restify res.redirect (open redirect)"

[[sink]]
call = ["restify.Response.header", "restify.Response.setHeader"]
args = [1]
kind = "header"
description = "Restify response header"
