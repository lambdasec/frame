[pack]
name = "llm-context"
language = "javascript"
description = "What an LLM app feeds its model from outside: retrieved documents (LangChain.js vector stores and retrievers) and MCP tool results and resources. Anyone who can write a document or run a tool server can put instructions in it (indirect prompt injection, OWASP LLM01)"
detect = { imports = ["@langchain/core", "@langchain/community", "@langchain/openai", "@langchain/pinecone",
                      "@langchain/qdrant", "langchain", "@modelcontextprotocol/sdk/client/index.js",
                      "@modelcontextprotocol/sdk/client"] }
references = ["https://genai.owasp.org/llmrisk/llm01-prompt-injection/",
              "https://unpkg.com/@langchain/core@0.3.40/dist/vectorstores.d.ts",
              "https://unpkg.com/@modelcontextprotocol/sdk@1.10.0/dist/esm/client/index.d.ts"]

# Documents a vector store or retriever returns: the search methods of any LangChain.js vector
# store (@langchain/core's VectorStore, implemented by every store package) and `invoke` /
# `getRelevantDocuments` of a retriever (a class named *Retriever, or what `asRetriever()` returns;
# a chat model's `invoke` is model output, the llm-sdks pack's).
[[source]]
call = ["@langchain/**.similaritySearch", "@langchain/**.similaritySearchWithScore",
        "@langchain/**.similaritySearchVectorWithScore", "@langchain/**.maxMarginalRelevanceSearch",
        "langchain/**.similaritySearch", "langchain/**.similaritySearchWithScore",
        "langchain/**.similaritySearchVectorWithScore", "langchain/**.maxMarginalRelevanceSearch",
        "@langchain/**.asRetriever.invoke", "@langchain/**.asRetriever.getRelevantDocuments",
        "langchain/**.asRetriever.invoke", "langchain/**.asRetriever.getRelevantDocuments",
        "@langchain/**.*Retriever.invoke", "@langchain/**.*Retriever.getRelevantDocuments",
        "langchain/**.*Retriever.invoke", "langchain/**.*Retriever.getRelevantDocuments"]
kind = "retrieved"
description = "retrieved documents"

# An MCP client's view of a server: a tool's result, a resource's contents, a prompt it supplies.
[[source]]
call = ["@modelcontextprotocol/sdk/client/index.js.Client.callTool", "@modelcontextprotocol/sdk/client/index.js.Client.readResource",
        "@modelcontextprotocol/sdk/client/index.js.Client.getPrompt", "@modelcontextprotocol/sdk/client.Client.callTool",
        "@modelcontextprotocol/sdk/client.Client.readResource", "@modelcontextprotocol/sdk/client.Client.getPrompt"]
kind = "retrieved"
description = "an MCP tool result or resource"
