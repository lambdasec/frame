[pack]
name = "fastify"
language = "javascript"
description = "Fastify route handlers and hooks on a fastify() instance, and what their request holds"
detect = { imports = ["fastify"] }
references = ["https://fastify.dev/docs/latest/Reference/Routes/", "https://fastify.dev/docs/latest/Reference/Request/",
              "https://fastify.dev/docs/latest/Reference/Hooks/", "https://github.com/fastify/fastify-cookie",
              "https://github.com/fastify/fastify-multipart"]

# What a request holds that the client chose: the parsed query, body and params, headers, the URL,
# the host, cookies (@fastify/cookie), uploads (@fastify/multipart's file() / files() / parts()),
# and the Node request (raw). Everything else (id, log, server, routeOptions) is server state.
[[request_type]]
id = "request"
fields = ["query", "body", "params", "headers", "url", "originalUrl", "hostname", "host", "cookies",
          "raw.headers", "raw.url", "raw.rawHeaders"]
methods = ["file", "files", "parts"]

# fastify.get / head / post / put / delete / options / patch / all(path, [opts,] handler),
# fastify.route({ handler, preHandler, ... }), request hooks: handler(request, reply).
[[entrypoint]]
id = "route"
registered_via = ["fastify.get", "fastify.head", "fastify.post", "fastify.put", "fastify.delete", "fastify.options", "fastify.patch", "fastify.all", "fastify.route.handler", "fastify.route.preHandler",
                  "fastify.route.preValidation", "fastify.route.onRequest", "fastify.addHook", "fastify.setNotFoundHandler"]
param_positions = [0]
params = "all"
request_type = "request"
description = "the request of a Fastify route handler or hook"

# setErrorHandler((error, request, reply) => ...)
[[entrypoint]]
id = "error-handler"
registered_via = ["fastify.setErrorHandler"]
param_positions = [1]
params = "all"
request_type = "request"
description = "the request of a Fastify error handler"

[[callback_param]]
registered_via = ["fastify.register"]
position = 0
origin = "fastify"

# handler(request, reply) / errorHandler(error, request, reply): the reply
# (https://fastify.dev/docs/latest/Reference/Reply/).
[[entrypoint]]
id = "route-reply"
registered_via = ["fastify.get", "fastify.head", "fastify.post", "fastify.put", "fastify.delete", "fastify.options", "fastify.patch", "fastify.all", "fastify.route.handler", "fastify.route.preHandler",
                  "fastify.route.preValidation", "fastify.route.onRequest", "fastify.addHook", "fastify.setNotFoundHandler"]
param_positions = [1]
params = "all"
origin = "fastify.FastifyReply"
description = "the reply of a Fastify route handler or hook"

[[entrypoint]]
id = "error-handler-reply"
registered_via = ["fastify.setErrorHandler"]
param_positions = [2]
params = "all"
origin = "fastify.FastifyReply"
description = "the reply of a Fastify error handler"

[[sink]]
call = ["fastify.FastifyReply.send"]
args = [0]
kind = "html"
json_for_literals = true      # an object or array is serialised as JSON
description = "Fastify reply.send"

[[sink]]
call = ["fastify.FastifyReply.redirect"]
args = [0, 1]
kind = "redirect"
description = "Fastify reply.redirect([code,] url)"

[[sink]]
call = ["fastify.FastifyReply.sendFile", "fastify.FastifyReply.download"]
args = [0]
kind = "path"
description = "@fastify/static sendFile / download"

[[sink]]
call = ["fastify.FastifyReply.header", "fastify.FastifyReply.headers"]
args = [1]
kind = "header"
description = "Fastify reply header"
