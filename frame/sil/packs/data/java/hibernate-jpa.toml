[pack]
name = "hibernate-jpa"
language = "java"
description = "Hibernate and JPA: HQL / JPQL / native query text, Criteria sqlRestriction"
detect = { imports = ["org.hibernate", "javax.persistence", "jakarta.persistence"] }

# The query string is the first argument; values bound with setParameter are not part of it.
[[sink]]
call = [
    "org.hibernate.Session.createQuery", "org.hibernate.Session.createSQLQuery", "org.hibernate.Session.createNativeQuery",
    "org.hibernate.StatelessSession.createQuery", "org.hibernate.StatelessSession.createSQLQuery",
    "org.hibernate.StatelessSession.createNativeQuery",
    "org.hibernate.query.QueryProducer.createQuery", "org.hibernate.query.QueryProducer.createNativeQuery",
    "javax.persistence.EntityManager.createQuery", "javax.persistence.EntityManager.createNativeQuery",
    "jakarta.persistence.EntityManager.createQuery", "jakarta.persistence.EntityManager.createNativeQuery",
]
kind = "sql"
description = "HQL / JPQL / native SQL text built from the argument"

# Criteria restriction with a raw SQL fragment.
[[sink]]
call = ["org.hibernate.criterion.Restrictions.sqlRestriction", "org.hibernate.criterion.Order.sqlFormula"]
kind = "sql"
description = "a raw SQL fragment inside a Criteria query"

# An EntityManager the container injects is a collaborator, not request-bound state.
[[injected_field]]
annotations = ["PersistenceContext", "PersistenceUnit", "javax.persistence.Persistence*", "jakarta.persistence.Persistence*"]

# An EntityManager's / Hibernate Session's writes change stored rows: a marker that the code
# writes stored data (read by the business-logic hunt), never a taint sink or a finding.
# https://jakarta.ee/specifications/persistence/3.1/apidocs/jakarta.persistence/jakarta/persistence/entitymanager
[[sink]]
call = ["jakarta.persistence.EntityManager.persist", "jakarta.persistence.EntityManager.merge",
        "jakarta.persistence.EntityManager.remove", "javax.persistence.EntityManager.persist",
        "javax.persistence.EntityManager.merge", "javax.persistence.EntityManager.remove",
        "org.hibernate.Session.save", "org.hibernate.Session.update", "org.hibernate.Session.saveOrUpdate",
        "org.hibernate.Session.persist", "org.hibernate.Session.merge", "org.hibernate.Session.delete",
        "org.hibernate.Session.remove"]
kind = "resource_modify"
description = "JPA / Hibernate write"

# Locking an entity (`em.lock(entity, LockModeType.PESSIMISTIC_WRITE)`, Hibernate `session.lock`)
# before changing it is safe against a concurrent request.
# https://jakarta.ee/specifications/persistence/3.1/apidocs/jakarta.persistence/jakarta/persistence/entitymanager#lock(java.lang.Object,jakarta.persistence.LockModeType)
[[concurrency]]
call = ["jakarta.persistence.EntityManager.lock", "javax.persistence.EntityManager.lock",
        "org.hibernate.Session.lock"]
kind = "lock"
