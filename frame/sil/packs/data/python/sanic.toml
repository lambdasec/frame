[pack]
name = "sanic"
language = "python"
description = "Sanic route handlers, responses that reflect HTML or serve files"
detect = { imports = ["sanic"] }

# Route handlers (@app.route / @app.get / @bp.post ...) are called with the Request and the
# route's path parameters (`/items/<item_id>`) as arguments (Sanic docs, "Routing").
[[entrypoint]]
id = "route-handler"
decorator = ["*.route", "*.get", "*.post", "*.put", "*.patch", "*.delete", "*.head", "*.options",
             "*.websocket"]
params = "all"
exclude_param = ["self", "cls"]
description = "Sanic handler argument (request or path parameter)"

[[sink]]
call = ["sanic.response.html", "sanic.html"]
kind = "html"
args = [0]
arg_names = ["body"]
description = "sanic.response.html sends its body as text/html"

[[sink]]
call = ["sanic.response.file", "sanic.response.file_stream", "sanic.file", "sanic.file_stream"]
kind = "filesystem"
args = [0]
arg_names = ["location"]

[[sink]]
call = ["sanic.response.redirect", "sanic.redirect"]
kind = "redirect"
args = [0]
arg_names = ["to"]
