[pack]
name = "fastapi"
language = "python"
description = "FastAPI / Starlette: route handlers, response classes that reflect, redirect or serve files"
detect = { imports = ["fastapi", "starlette"] }

# Starlette's request (FastAPI re-exports it as fastapi.Request) and WebSocket: client data except
# what the application and middleware set (`app`, `state`, `session` from SessionMiddleware,
# `auth`/`user` from AuthenticationMiddleware) and the URLs it builds from route names.
[[request_type]]
id = "Request"
fields = ["*"]
server_state = ["app", "state", "url_for", "session", "auth", "user", "is_disconnected", "send_push_promise",
                "send_early_hints"]
headers = ["headers"]
sessions = ["session"]
identities = ["user", "auth"]               # AuthenticationMiddleware's
references = ["https://starlette.dev/requests/", "https://fastapi.tiangolo.com/advanced/using-request-directly/"]

[[request_type]]
id = "WebSocket"
fields = ["*"]
server_state = ["app", "state", "url_for", "session", "auth", "user", "client_state", "application_state"]
headers = ["headers"]
sessions = ["session"]
identities = ["user", "auth"]
references = ["https://starlette.dev/websockets/"]

# A path operation receives the URL's path and query parameters, body fields, headers and cookies as
# its declared parameters (FastAPI binds them by name and type); parameters of the framework's own
# types are not client values (a Request or WebSocket is the request object, below).
[[entrypoint]]
id = "route"
registered_via = ["fastapi.FastAPI.get", "fastapi.FastAPI.post", "fastapi.FastAPI.put", "fastapi.FastAPI.patch", "fastapi.FastAPI.delete", "fastapi.FastAPI.head", "fastapi.FastAPI.options", "fastapi.FastAPI.trace", "fastapi.FastAPI.api_route", "fastapi.FastAPI.websocket", "fastapi.APIRouter.get", "fastapi.APIRouter.post", "fastapi.APIRouter.put", "fastapi.APIRouter.patch", "fastapi.APIRouter.delete", "fastapi.APIRouter.head", "fastapi.APIRouter.options", "fastapi.APIRouter.trace", "fastapi.APIRouter.api_route", "fastapi.APIRouter.websocket", "fastapi.routing.APIRouter.get", "fastapi.routing.APIRouter.post", "fastapi.routing.APIRouter.put", "fastapi.routing.APIRouter.patch", "fastapi.routing.APIRouter.delete", "fastapi.routing.APIRouter.head", "fastapi.routing.APIRouter.options", "fastapi.routing.APIRouter.trace", "fastapi.routing.APIRouter.api_route", "fastapi.routing.APIRouter.websocket",
                  "fastapi.FastAPI.add_api_route", "fastapi.APIRouter.add_api_route"]
params = "all"
exclude_param_type = ["fastapi.BackgroundTasks", "fastapi.Response", "starlette.responses.Response",
                      "sqlalchemy.orm.Session", "sqlalchemy.ext.asyncio.AsyncSession",
                      "fastapi.Request", "fastapi.requests.Request", "starlette.requests.Request",
                      "starlette.requests.HTTPConnection", "fastapi.requests.HTTPConnection",
                      "fastapi.WebSocket", "fastapi.websockets.WebSocket", "starlette.websockets.WebSocket"]

# A parameter declared as the Request / WebSocket gets it, whatever its name or position (a path
# operation, a dependency, middleware's dispatch).
[[entrypoint]]
id = "typed-request"
method = ["*"]
params = "typed"
param_type = ["fastapi.Request", "fastapi.requests.Request", "starlette.requests.Request",
              "starlette.requests.HTTPConnection", "fastapi.requests.HTTPConnection"]
request_type = "Request"

[[entrypoint]]
id = "typed-websocket"
method = ["*"]
params = "typed"
param_type = ["fastapi.WebSocket", "fastapi.websockets.WebSocket", "starlette.websockets.WebSocket"]
request_type = "WebSocket"

# Starlette function endpoints: Route(path, endpoint) calls endpoint(request); WebSocketRoute
# calls it with the WebSocket.
[[entrypoint]]
id = "route-endpoint"
registered_via = ["starlette.routing.Route", "starlette.applications.Starlette.add_route",
                  "starlette.applications.Starlette.route", "fastapi.FastAPI.add_route"]
param_positions = [0]
request_type = "Request"

[[entrypoint]]
id = "websocket-endpoint"
registered_via = ["starlette.routing.WebSocketRoute", "starlette.applications.Starlette.add_websocket_route",
                  "starlette.applications.Starlette.websocket_route"]
param_positions = [0]
request_type = "WebSocket"

# HTTPEndpoint dispatches to the method named after the HTTP method with the request;
# WebSocketEndpoint calls on_connect / on_receive / on_disconnect with the WebSocket, on_receive
# also with the decoded message.
[[entrypoint]]
id = "http-endpoint"
extends = ["starlette.endpoints.HTTPEndpoint"]
method = ["get", "post", "put", "patch", "delete", "head", "options"]
param_positions = [0]
request_type = "Request"

[[entrypoint]]
id = "websocket-endpoint-methods"
extends = ["starlette.endpoints.WebSocketEndpoint"]
method = ["on_connect", "on_receive", "on_disconnect"]
param_positions = [0]
request_type = "WebSocket"

[[entrypoint]]
id = "websocket-endpoint-message"
extends = ["starlette.endpoints.WebSocketEndpoint"]
method = ["on_receive"]
param_positions = [1]
params = "all"

[[sink]]
call = ["fastapi.responses.HTMLResponse", "starlette.responses.HTMLResponse"]
kind = "html"
args = [0]
arg_names = ["content"]
description = "HTMLResponse sends its content as text/html"

[[sink]]
call = ["fastapi.responses.Response", "starlette.responses.Response"]
kind = "html"
args = [0]
arg_names = ["content"]
when_kwarg = { name = "media_type", value = "text/html" }

[[sink]]
call = ["fastapi.responses.RedirectResponse", "starlette.responses.RedirectResponse"]
kind = "redirect"
args = [0]
arg_names = ["url"]

[[sink]]
call = ["fastapi.responses.FileResponse", "starlette.responses.FileResponse"]
kind = "filesystem"
args = [0]
arg_names = ["path"]
description = "FileResponse streams the file at path"

[[sanitizer]]
call = ["html.escape", "markupsafe.escape"]
kinds = ["html"]
