[pack]
name = "bottle"
language = "python"
description = "Bottle routes, request accessors, template(), static_file, redirect"
detect = { imports = ["bottle"] }
# The module-level request proxy: passed to a helper, it is the client's request whatever the
# helper names its parameter.

# Bottle's `request` is a module-level proxy: `request.query.id`, `request.forms.name`,
# `request.params.get(...)`, `request.json`, `request.body` are all client data.
# The request object (bottle.BaseRequest); inside a request the module-level `bottle.request`
# (a LocalRequest) is that request in every function. Client data: the parsed query string and
# form, their union, uploads, cookies, headers, the raw body and query string, the JSON body.
[[request_type]]
id = "BaseRequest"
fields = ["query", "forms", "params", "GET", "POST", "json", "body", "cookies", "files", "headers", "query_string"]
methods = ["get_cookie"]
kinds = { files = "file" }
headers = ["headers"]
proxies = ["bottle.request"]
references = ["https://bottlepy.org/docs/dev/api.html#bottle.BaseRequest"]

[[sink]]
call = ["bottle.static_file"]
kind = "filesystem"
description = "static_file(filename, root=...) serves root/filename; the filename must not be client data"

[[sink]]
call = ["bottle.redirect"]
kind = "redirect"

# template("<h1>{{x}}</h1>") compiles a string that is not a template *name* as SimpleTemplate source.
[[sink]]
call = ["bottle.template", "bottle.SimpleTemplate", "bottle.jinja2_template"]
kind = "template"
args = [0]
