[pack]
name = "aiohttp"
language = "python"
description = "aiohttp server responses (HTML, redirects, files) and client requests (SSRF)"
detect = { imports = ["aiohttp"] }

# Handlers are plain coroutines registered with app.router.add_*; the request accessors
# (request.query, request.match_info, await request.post()/json()) are sources in the built-in specs.

# The request (aiohttp.web.Request): the URL's query and captured path values, the headers and
# cookies, and the body by any of its readers.
[[request_type]]
id = "Request"
fields = ["query", "query_string", "match_info", "rel_url.query", "rel_url.query_string", "url.query",
          "url.query_string", "path_qs", "headers", "raw_headers", "cookies", "content"]
methods = ["read", "text", "json", "post", "multipart"]
headers = ["headers"]
references = ["https://docs.aiohttp.org/en/stable/web_reference.html#request-and-base-request"]

# A web.View instance keeps the request (`self.request`); aiohttp calls its method named after the
# HTTP method.
[[request_type]]
id = "View"
objects = { request = "Request" }
references = ["https://docs.aiohttp.org/en/stable/web_reference.html#view"]

# Handlers are coroutines taking the request: registered on the application's router
# (`app.router.add_get(path, handler)`), as route definitions (`web.get(path, handler)` for
# `app.add_routes`), or with a RouteTableDef's decorators (`@routes.get(path)`); middleware is
# called with the request and the next handler.
[[entrypoint]]
id = "handler"
registered_via = ["aiohttp.web.Application.router.add_*", "aiohttp.web.UrlDispatcher.add_*",
                  "aiohttp.web.get", "aiohttp.web.post", "aiohttp.web.put", "aiohttp.web.patch",
                  "aiohttp.web.delete", "aiohttp.web.head", "aiohttp.web.options", "aiohttp.web.route",
                  "aiohttp.web.RouteTableDef.*"]
param_positions = [0]
request_type = "Request"
description = "the request an aiohttp handler receives"

# A parameter declared as aiohttp's request is one, whoever calls the function.
[[entrypoint]]
id = "typed-request"
method = ["*"]
params = "typed"
param_type = ["aiohttp.web.Request", "aiohttp.web.BaseRequest", "aiohttp.web_request.Request",
              "aiohttp.web_request.BaseRequest"]
request_type = "Request"

[[entrypoint]]
id = "middleware"
decorator = ["aiohttp.web.middleware"]
param_positions = [0]
request_type = "Request"

[[entrypoint]]
id = "class-view"
extends = ["aiohttp.web.View"]
receiver = true
request_type = "View"
exclude_method = ["__init__"]

[[sink]]
call = ["aiohttp.web.HTTPFound", "aiohttp.web.HTTPMovedPermanently", "aiohttp.web.HTTPSeeOther",
        "aiohttp.web.HTTPTemporaryRedirect", "aiohttp.web.HTTPPermanentRedirect", "aiohttp.web.HTTPUseProxy",
        "aiohttp.web.HTTPMultipleChoices"]
kind = "redirect"
args = [0]
arg_names = ["location"]

[[sink]]
call = ["aiohttp.web.FileResponse", "aiohttp.web_fileresponse.FileResponse"]
kind = "filesystem"
args = [0]
arg_names = ["path"]

[[sink]]
call = ["aiohttp.web.Response", "aiohttp.web_response.Response"]
kind = "html"
args = []
arg_names = ["text", "body"]
when_kwarg = { name = "content_type", value = "text/html" }
description = "a Response served as text/html reflects its body"

# Client: a ClientSession's request methods fetch the URL (the session known by its value:
# `async with aiohttp.ClientSession() as session`).
[[sink]]
call = ["aiohttp.ClientSession.get", "aiohttp.ClientSession.post", "aiohttp.ClientSession.put",
        "aiohttp.ClientSession.patch", "aiohttp.ClientSession.delete", "aiohttp.ClientSession.head",
        "aiohttp.ClientSession.options", "aiohttp.client.ClientSession.get", "aiohttp.client.ClientSession.post"]
kind = "ssrf"
args = [0]
arg_names = ["url", "str_or_url"]
description = "aiohttp ClientSession request to a URL the caller controls"

[[sink]]
call = ["aiohttp.ClientSession.request", "aiohttp.ClientSession.ws_connect"]
kind = "ssrf"
args = [1]
arg_names = ["url"]

[[sink]]
call = ["aiohttp.request"]
kind = "ssrf"
args = [1]
arg_names = ["url"]
