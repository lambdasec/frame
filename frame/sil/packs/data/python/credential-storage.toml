[pack]
name = "credential-storage"
language = "python"
description = "Hash and key-derivation functions: a stored credential replaced by its digest"
detect = { imports = ["hashlib", "hmac", "passlib", "bcrypt", "argon2", "werkzeug", "crypt",
                      "django", "nacl"] }
references = ["https://docs.python.org/3/library/hashlib.html",
              "https://passlib.readthedocs.io/en/stable/lib/passlib.ifc.html",
              "https://werkzeug.palletsprojects.com/en/stable/utils/#werkzeug.security.generate_password_hash"]

# A digest, MAC or password hash of a credential is what a credential column should hold: the
# credential itself is not recoverable from it. (How strong a hash is for a password is a separate
# question, CWE-916.) The digest methods (`.hexdigest()`) keep what the hash object holds.
[[sanitizer]]
call = ["hashlib.md5", "hashlib.sha1", "hashlib.sha224", "hashlib.sha256", "hashlib.sha384", "hashlib.sha512",
        "hashlib.sha3_224", "hashlib.sha3_256", "hashlib.sha3_384", "hashlib.sha3_512", "hashlib.blake2b",
        "hashlib.blake2s", "hashlib.new", "hashlib.pbkdf2_hmac", "hashlib.scrypt", "hmac.new", "hmac.digest",
        "bcrypt.hashpw", "bcrypt.kdf", "passlib.hash.*.hash", "passlib.hash.*.encrypt", "passlib.hash.*.using.hash",
        "passlib.context.CryptContext.hash", "passlib.context.CryptContext.encrypt",
        "argon2.PasswordHasher.hash", "argon2.hash_password", "werkzeug.security.generate_password_hash",
        "crypt.crypt", "django.contrib.auth.hashers.make_password",
        "nacl.pwhash.str", "nacl.pwhash.argon2id.str", "nacl.pwhash.scrypt.str"]
kinds = ["password"]
