[pack]
name = "django"
language = "python"
description = "Django ORM escape hatches, template compilation and raw SQL"
detect = { imports = ["django"] }

# QuerySet.extra() splices where / select / order_by / tables strings into the SQL.
[[sink]]
# A model's manager (`Model.objects`, typed by the model's base class, value-types.toml) and the
# querysets it returns.
call = ["django.db.models.Manager.**.extra", "django.db.models.QuerySet.**.extra", "django.db.models.Manager.extra",
        "django.db.models.QuerySet.extra"]
kind = "sql"
args = [0]                       # positional `select`; the strings passed by keyword are `arg_names`
arg_names = ["where", "select", "order_by", "tables", "select_params"]
description = "QuerySet.extra() is raw SQL"

# A custom Manager / QuerySet: its methods run on one, so `self.raw(sql)` is Manager.raw.
[[entrypoint]]
id = "manager-origin"
extends = ["django.db.models.Manager", "django.db.models.manager.Manager", "django.db.models.manager.BaseManager"]
receiver = true
origin = "django.db.models.Manager"

[[entrypoint]]
id = "queryset-origin"
extends = ["django.db.models.QuerySet", "django.db.models.query.QuerySet"]
receiver = true
origin = "django.db.models.QuerySet"

[[sink]]
call = ["django.db.models.Manager.raw", "django.db.models.Manager.**.raw", "django.db.models.QuerySet.raw"]
kind = "sql"
args = [0]
description = "Manager.raw() / QuerySet.raw() runs the SQL string it is given"

[[sink]]
call = ["django.db.models.expressions.RawSQL", "django.db.models.RawSQL"]
kind = "sql"
args = [0]

# django.template.Template(string) compiles the string as template source.
[[sink]]
call = ["django.template.Template", "django.template.base.Template"]
kind = "template"
args = [0]

# A template Engine (`Engine()`, `Engine.get_default()`) compiles from_string's argument; so did
# the old loader function.
[[sink]]
call = ["django.template.Engine.from_string", "django.template.engine.Engine.from_string",
        "django.template.Engine.get_default.from_string", "django.template.engine.Engine.get_default.from_string",
        "django.template.loader.get_template_from_string"]
kind = "template"
args = [0]
description = "Engine.from_string compiles its argument as template source"

# The request a view is handed (django.http.HttpRequest; handlers get its WSGIRequest / ASGIRequest
# subclass): everything on it comes from the client except what the server, the application or
# middleware set (docs "Request and response objects": attributes set by application code and by
# middleware; the routing result, the upload handlers, the scheme). Uploaded files are file
# contents and client-given names; `headers` is the header map; `session` the server-side session.
[[request_type]]
id = "HttpRequest"
fields = ["*"]
server_state = ["user", "auser", "session", "site", "resolver_match", "current_app", "urlconf",
                "exception_reporter_filter", "exception_reporter_class", "encoding", "upload_handlers",
                "multipart_parser_class", "scheme", "is_secure", "LANGUAGE_CODE", "csrf_processing_done"]
kinds = { FILES = "file" }
headers = ["headers"]
sessions = ["session"]
identities = ["user", "auser"]              # AuthenticationMiddleware's user (auser() in async views)
references = ["https://docs.djangoproject.com/en/stable/ref/request-response/#httprequest-objects"]

# A class-based view instance: View.setup() keeps the request and the URL's captured values on
# it (`self.request`, `self.args`, `self.kwargs`) before dispatch() calls the handler method.
[[request_type]]
id = "View"
fields = ["args", "kwargs"]
objects = { request = "HttpRequest" }
references = ["https://docs.djangoproject.com/en/stable/ref/class-based-views/base/#django.views.generic.base.View.setup"]

# Function views: the URLconf routes to them (`path("x/", views.show)` in urls.py; a directory scan
# finds a view another file registers). Django calls a view with the HttpRequest first and the
# URL pattern's captured values after it (docs: "URL dispatcher").
[[entrypoint]]
id = "view-request"
registered_via = ["django.urls.path", "django.urls.re_path", "django.conf.urls.url"]
param_positions = [0]
request_type = "HttpRequest"
description = "the HttpRequest a routed view receives"

[[entrypoint]]
id = "view-arguments"
registered_via = ["django.urls.path", "django.urls.re_path", "django.conf.urls.url"]
params = "all"
params_from = 1
description = "a value captured from the URL, passed to a routed view"

# Class-based views (View and the generic views built on it): every method runs on an instance
# set up for the request; dispatch() calls the method named after the HTTP method with the request
# and the captured values.
[[entrypoint]]
id = "class-based-view"
extends = ["django.views.View", "django.views.generic.**", "django.contrib.*.views.*"]
receiver = true
request_type = "View"
exclude_method = ["__init__", "setup"]
description = "a class-based view instance (self.request, self.args, self.kwargs)"

[[entrypoint]]
id = "class-based-view-request"
extends = ["django.views.View", "django.views.generic.**", "django.contrib.*.views.*"]
method = ["get", "post", "put", "patch", "delete", "head", "options", "trace"]
param_positions = [0]
request_type = "HttpRequest"
description = "the HttpRequest a class-based view's handler method receives"

[[entrypoint]]
id = "class-based-view-arguments"
extends = ["django.views.View", "django.views.generic.**", "django.contrib.*.views.*"]
method = ["get", "post", "put", "patch", "delete", "head", "options", "trace"]
params = "all"
params_from = 1
description = "a value captured from the URL, passed to a class-based view's handler method"

# Old-style middleware (MiddlewareMixin): Django calls process_request / process_view /
# process_exception / process_response / process_template_response with the request first.
[[entrypoint]]
id = "middleware-request"
extends = ["django.utils.deprecation.MiddlewareMixin"]
method = ["process_request", "process_view", "process_exception", "process_response",
          "process_template_response", "__call__"]
param_positions = [0]
request_type = "HttpRequest"
description = "the HttpRequest a MiddlewareMixin hook receives"

# Middleware is what settings.MIDDLEWARE names by dotted path: a class Django constructs with
# get_response and then calls (`__call__(request)`) or whose hooks it calls with the request
# first, or a factory whose returned function it calls with the request (docs "Middleware").
[[setting_registration]]
setting = "MIDDLEWARE"
registered_as = "django.middleware"
references = ["https://docs.djangoproject.com/en/stable/topics/http/middleware/"]

[[entrypoint]]
id = "settings-middleware"
registered_via = ["django.middleware"]
method = ["__call__", "process_request", "process_view", "process_exception", "process_response",
          "process_template_response"]
param_positions = [0]
request_type = "HttpRequest"
description = "the HttpRequest a middleware listed in MIDDLEWARE receives"

[[entrypoint]]
id = "settings-middleware-function"
registered_via = ["django.middleware()"]
param_positions = [0]
request_type = "HttpRequest"
description = "the HttpRequest the function a middleware factory returns receives"

# The admin: ModelAdmin (and inline) hooks Django calls with the request, at the position their
# documented signatures give it; a changelist search term and the object id in the URL are the
# client's (docs "The Django admin site", ModelAdmin methods).
[[entrypoint]]
id = "admin-hook-request"
extends = ["django.contrib.admin.ModelAdmin", "django.contrib.admin.options.ModelAdmin",
           "django.contrib.admin.StackedInline", "django.contrib.admin.TabularInline",
           "django.contrib.admin.options.InlineModelAdmin"]
method = ["save_model", "delete_model", "delete_queryset", "save_formset", "save_related", "get_ordering",
          "get_search_results", "get_autocomplete_fields", "get_readonly_fields", "get_prepopulated_fields",
          "get_list_display", "get_list_display_links", "get_exclude", "get_fields", "get_fieldsets",
          "get_list_filter", "get_list_select_related", "get_search_fields", "get_sortable_by",
          "get_inline_instances", "get_inlines", "get_form", "get_formset", "get_formsets_with_inlines",
          "get_changeform_initial_data", "has_view_permission", "has_add_permission", "has_change_permission",
          "has_delete_permission", "has_module_permission", "get_queryset", "message_user", "get_paginator",
          "response_add", "response_change", "response_delete", "get_formset_kwargs", "get_changelist",
          "get_changelist_form", "get_changelist_formset", "add_view", "change_view", "changelist_view",
          "delete_view", "history_view", "get_actions", "get_action_choices", "get_extra", "get_min_num",
          "get_max_num"]
param_positions = [0]
request_type = "HttpRequest"

[[entrypoint]]
id = "admin-formfield-request"
extends = ["django.contrib.admin.ModelAdmin", "django.contrib.admin.options.ModelAdmin",
           "django.contrib.admin.StackedInline", "django.contrib.admin.TabularInline",
           "django.contrib.admin.options.InlineModelAdmin"]
method = ["formfield_for_foreignkey", "formfield_for_manytomany", "formfield_for_choice_field",
          "get_deleted_objects"]
param_positions = [1]
request_type = "HttpRequest"

[[entrypoint]]
id = "admin-search-term"
extends = ["django.contrib.admin.ModelAdmin", "django.contrib.admin.options.ModelAdmin"]
method = ["get_search_results"]
param_positions = [2]

[[entrypoint]]
id = "admin-object-id"
extends = ["django.contrib.admin.ModelAdmin", "django.contrib.admin.options.ModelAdmin"]
method = ["change_view", "delete_view", "history_view"]
param_positions = [1]

# Admin actions: Django calls an @admin.action function as (modeladmin, request, queryset), and a
# ModelAdmin action method as (self, request, queryset): the request is the second argument.
[[entrypoint]]
id = "admin-action-request"
decorator = ["django.contrib.admin.action", "django.contrib.admin.decorators.action"]
unbound = true
param_positions = [1]
request_type = "HttpRequest"

# A view passed through one of Django's view decorators used as a function (`path("x/",
# login_required(views.show))`) is still the view: these return a wrapper calling it with the
# same arguments.
[[wrapper]]
call = ["django.contrib.auth.decorators.login_required", "django.contrib.auth.decorators.permission_required",
        "django.contrib.auth.decorators.user_passes_test", "django.contrib.auth.decorators.login_not_required",
        "django.contrib.admin.views.decorators.staff_member_required",
        "django.views.decorators.csrf.csrf_exempt", "django.views.decorators.csrf.csrf_protect",
        "django.views.decorators.csrf.ensure_csrf_cookie", "django.views.decorators.csrf.requires_csrf_token",
        "django.views.decorators.cache.cache_page", "django.views.decorators.cache.never_cache",
        "django.views.decorators.cache.cache_control",
        "django.views.decorators.http.require_http_methods", "django.views.decorators.http.require_GET",
        "django.views.decorators.http.require_POST", "django.views.decorators.http.require_safe",
        "django.views.decorators.clickjacking.xframe_options_exempt",
        "django.views.decorators.clickjacking.xframe_options_deny",
        "django.views.decorators.clickjacking.xframe_options_sameorigin",
        "django.views.decorators.vary.vary_on_headers", "django.views.decorators.vary.vary_on_cookie",
        "django.views.decorators.gzip.gzip_page"]
references = ["https://docs.djangoproject.com/en/stable/topics/http/decorators/",
              "https://docs.djangoproject.com/en/stable/topics/auth/default/#the-login-required-decorator"]
