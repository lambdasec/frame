[pack]
name = "django"
language = "python"
description = "Django ORM escape hatches, template compilation and raw SQL"
detect = { imports = ["django"] }

# QuerySet.extra() splices where / select / order_by / tables strings into the SQL.
[[sink]]
name = ["objects.extra", "queryset.extra", "qs.extra"]
kind = "sql"
args = [0]                       # positional `select`; the strings passed by keyword are `arg_names`
arg_names = ["where", "select", "order_by", "tables", "select_params"]
description = "QuerySet.extra() is raw SQL"

# A custom Manager/QuerySet method calling the inherited raw()/extra() on itself.
[[sink]]
name = ["self.raw", "self.get_queryset().raw", "self.model.objects.raw"]
kind = "sql"
args = [0]
description = "Manager.raw() runs the SQL string it is given"

[[sink]]
name = ["self.extra", "self.get_queryset().extra"]
kind = "sql"
args = [0]
arg_names = ["where", "select", "order_by", "tables"]
description = "QuerySet.extra() is raw SQL"

[[sink]]
call = ["django.db.models.expressions.RawSQL", "django.db.models.RawSQL"]
kind = "sql"
args = [0]

# django.template.Template(string) compiles the string as template source.
[[sink]]
call = ["django.template.Template", "django.template.base.Template"]
kind = "template"
args = [0]

[[sink]]
name = ["engine.from_string", "Engine.from_string", "get_template_from_string"]
kind = "template"
args = [0]
description = "Engine.from_string compiles its argument as template source"

# Class-based views keep the request on `self`.
[[source]]
name = ["self.request.GET.get", "self.request.GET.getlist", "self.request.POST.get", "self.request.POST.getlist",
        "self.request.COOKIES.get", "self.request.META.get", "self.request.GET.__getitem__",
        "self.request.POST.__getitem__", "self.request.GET", "self.request.POST", "self.request.body",
        "self.request.headers.get", "self.request.FILES.get"]
kind = "user_input"

# Views: Django calls a view with the HttpRequest first and the URL pattern's captured values after
# it (docs: "Writing views", "URL dispatcher"). urls.py routes by name, so the view carries no
# decorator; the documented signature (first parameter `request`, also after `self` in a
# class-based view's get/post) is the evidence. The request is tainted as a whole; what the server
# set on it (`request.user`, `request.session`) is not client data (request-objects.toml).
[[entrypoint]]
id = "view-arguments"
first_param = ["request"]
params = "all"
exclude_param = ["self", "cls"]
description = "Django view argument (the HttpRequest, or a value captured from the URL)"
