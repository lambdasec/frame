[pack]
name = "pyramid"
language = "python"
description = "Pyramid views: request.params / matchdict / json_body, HTML responses, redirects, static files"
detect = { imports = ["pyramid"] }

# Pyramid views take the request (function views) or hold it on self (class views).
# The request (pyramid.request.Request, a WebOb request): its parameters, the URL pattern's matched
# values, the JSON and raw body, cookies and headers are the client's; what the router, security
# and the application add (context, registry, session, identity, the URL generators) is not.
[[request_type]]
id = "Request"
fields = ["params", "GET", "POST", "matchdict", "json_body", "json", "body", "body_file", "text", "cookies",
          "headers", "query_string", "path_qs"]
headers = ["headers"]
identities = ["identity", "authenticated_userid"]    # from the security policy
origin = "pyramid.request.Request"
references = ["https://docs.pylonsproject.org/projects/pyramid/en/latest/api/request.html",
              "https://docs.pylonsproject.org/projects/webob/en/stable/api/request.html"]

# View callables: Pyramid calls a function view with the request, or with the context and the
# request when it takes two arguments (docs "View Callables"); a view class is constructed with
# them and its view method called on the instance.
[[entrypoint]]
id = "view-request"
decorator = ["pyramid.view.view_config"]
arity = [1]
param_positions = [0]
request_type = "Request"

[[entrypoint]]
id = "view-context-request"
decorator = ["pyramid.view.view_config"]
arity = [2]
param_positions = [1]
request_type = "Request"

[[entrypoint]]
id = "configured-view-request"
registered_via = ["pyramid.config.Configurator.add_view"]
arity = [1]
param_positions = [0]
request_type = "Request"

[[entrypoint]]
id = "configured-view-context-request"
registered_via = ["pyramid.config.Configurator.add_view"]
arity = [2]
param_positions = [1]
request_type = "Request"

[[entrypoint]]
id = "view-class-request"
class_decorator = ["pyramid.view.view_config", "pyramid.view.view_defaults"]
method = ["__init__"]
arity = [2]
param_positions = [0]
request_type = "Request"

[[entrypoint]]
id = "view-class-context-request"
class_decorator = ["pyramid.view.view_config", "pyramid.view.view_defaults"]
method = ["__init__"]
arity = [3]
param_positions = [1]
request_type = "Request"

[[sink]]
call = ["pyramid.response.Response"]
kind = "html"
args = [0]
arg_names = ["body", "text"]
description = "a pyramid Response defaults to text/html"

[[sink]]
call = ["pyramid.httpexceptions.HTTPFound", "pyramid.httpexceptions.HTTPMovedPermanently",
        "pyramid.httpexceptions.HTTPSeeOther", "pyramid.httpexceptions.HTTPTemporaryRedirect",
        "pyramid.httpexceptions.HTTPPermanentRedirect"]
kind = "redirect"
args = [0]
arg_names = ["location"]

[[sink]]
call = ["pyramid.response.FileResponse"]
kind = "filesystem"
args = [0]
arg_names = ["path"]

# URLs the framework builds from route names are not attacker data even though they are
# methods of the request.
# URLs the application builds from route and resource names.
[[sanitizer]]
call = ["pyramid.request.Request.route_url", "pyramid.request.Request.route_path",
        "pyramid.request.Request.static_url", "pyramid.request.Request.static_path",
        "pyramid.request.Request.resource_url", "pyramid.request.Request.resource_path",
        "pyramid.request.Request.current_route_url", "pyramid.request.Request.current_route_path"]
kinds = ["redirect", "ssrf", "html", "xss", "filesystem", "sql"]
