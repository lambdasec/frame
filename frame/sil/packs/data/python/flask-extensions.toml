[pack]
name = "flask-extensions"
language = "python"
description = "Flask extensions and idioms: flask-restful resources, Flask-SocketIO handlers, render_template_string as SSTI"
detect = { imports = ["flask", "flask_restful", "flask_restx", "flask_socketio", "flask_classful"] }

# flask-restful / flask-restx: Resource.get(self, <url vars>) etc.
[[entrypoint]]
id = "restful-resource"
extends = ["flask_restful.Resource", "flask_restx.Resource", "flask_restful_swagger.*", "flask.views.MethodView"]
method = ["get", "post", "put", "patch", "delete", "head", "options"]
params = "all"

# Flask-SocketIO: the event payload is whatever the client emitted.
[[entrypoint]]
id = "socketio-event"
decorator = ["*.on", "*.on_event", "flask_socketio.SocketIO.on", "*.event"]
params = "all"

# render_template_string(source, **ctx) compiles `source` as a Jinja template: attacker data in
# the source is server-side template injection (the escaped context variables are safe).
[[sink]]
call = ["flask.render_template_string", "flask.templating.render_template_string"]
kind = "template"
args = [0]
arg_names = ["source"]
