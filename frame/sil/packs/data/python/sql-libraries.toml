[pack]
name = "sql-libraries"
language = "python"
description = "Raw-SQL entry points of peewee, pony, pandas, SQLAlchemy and sqlite3"
detect = { imports = ["peewee", "playhouse", "pony", "pandas", "sqlalchemy", "sqlite3", "records", "databases", "sqlmodel"] }

[[sink]]
call = ["pandas.read_sql", "pandas.read_sql_query", "pandas.io.sql.read_sql", "pandas.io.sql.read_sql_query"]
kind = "sql"
args = [0]
arg_names = ["sql"]
description = "pandas.read_sql runs a SQL string (a table name is also accepted but a query is the common use)"

# peewee: Database.execute_sql(sql, params), Model.raw(sql), SQL(sql) fragments.
[[sink]]
call = ["peewee.SQL", "peewee.Database.execute_sql", "peewee.*Database.execute_sql", "playhouse.**.execute_sql"]
kind = "sql"
args = [0]

# pony: Database.select / get / exists / execute / insert take SQL text; Entity.select_by_sql too.
[[sink]]
call = ["pony.orm.Database.select", "pony.orm.Database.get", "pony.orm.Database.exists", "pony.orm.Database.execute",
        "pony.orm.core.Database.select", "pony.orm.core.Database.get", "pony.orm.core.Database.exists",
        "pony.orm.core.Database.execute", "pony.orm.**.Entity.select_by_sql", "pony.orm.**.Entity.get_by_sql"]
kind = "sql"
args = [0]

# sqlite3 runs several statements, so injected text is arbitrary SQL.
[[sink]]
call = ["sqlite3.Connection.executescript", "sqlite3.Cursor.executescript", "connection.executescript",
        "cursor.executescript"]                  # a typed DB-API connection or cursor (value-types.toml)
kind = "sql"
args = [0]

# SQLAlchemy: Query.from_statement(text(...)) -- `text` is already a sink; literal_column and
# the query's filter(text(...)) / order_by(text(...)) forms are covered by `text`.
[[sink]]
call = ["sqlalchemy.sql.expression.literal_column", "sqlalchemy.literal_column"]
kind = "sql"
args = [0]

# records / databases (async): db.query("...") and database.fetch_all("...")
[[sink]]
call = ["databases.Database.fetch_all", "databases.Database.fetch_one", "databases.Database.execute",
        "databases.Database.fetch_val", "databases.Database.iterate", "records.Database.query"]
kind = "sql"
args = [0]
arg_names = ["query"]

# SQLAlchemy, for the read-then-write check only: `with_for_update()` locks the selected rows,
# `update(T).values(n=T.n - 1)` is computed by the database (a value that reads its own column),
# loads read rows and the session's commit / flush writes the objects changed since. A query
# `update` or `delete` writes too. None of these is a taint sink or a resource marker.
# https://docs.sqlalchemy.org/en/20/orm/queryguide/query.html#sqlalchemy.orm.Query.with_for_update
# https://docs.sqlalchemy.org/en/20/core/dml.html#sqlalchemy.sql.expression.ValuesBase.values
# https://docs.sqlalchemy.org/en/20/orm/session_basics.html#flushing
[[concurrency]]
call = ["sqlalchemy.**.with_for_update", "flask_sqlalchemy.**.with_for_update"]
kind = "lock"

[[concurrency]]
call = ["sqlalchemy.update.**.values", "sqlalchemy.sql.expression.update.**.values",
        "sqlalchemy.sql.update.**.values", "sqlalchemy.**.on_conflict_do_update"]
self_reference = true
kind = "atomic"

[[concurrency]]
call = ["sqlalchemy.orm.Session.get", "sqlalchemy.orm.Session.scalar", "sqlalchemy.orm.Session.scalars",
        "sqlalchemy.orm.Session.query.**.one", "sqlalchemy.orm.Session.query.**.one_or_none",
        "sqlalchemy.orm.Session.query.**.first", "sqlalchemy.orm.Session.query.**.all",
        "sqlalchemy.orm.Session.query.**.scalar", "sqlalchemy.orm.Session.query.**.get",
        "sqlalchemy.orm.Session.execute.**.scalar*", "sqlalchemy.orm.Session.execute.**.one*",
        "sqlalchemy.orm.Session.execute.**.first", "sqlalchemy.orm.Session.execute.**.all"]
kind = "read"

[[concurrency]]
call = ["sqlalchemy.orm.Session.commit", "sqlalchemy.orm.Session.flush",
        "sqlalchemy.orm.Session.query.**.update", "sqlalchemy.orm.Session.query.**.delete"]
kind = "write"

# `update(T).where(T.n < max).values(n=...)`: a where on a column the values set is a
# compare-and-set.
[[concurrency]]
call = ["sqlalchemy.update.**.values", "sqlalchemy.sql.expression.update.**.values",
        "sqlalchemy.sql.update.**.values"]
kind = "write"
filter = [".where"]
update = [".values"]
