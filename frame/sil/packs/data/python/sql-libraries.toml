[pack]
name = "sql-libraries"
language = "python"
description = "Raw-SQL entry points of peewee, pony, pandas, SQLAlchemy and sqlite3"
detect = { imports = ["peewee", "playhouse", "pony", "pandas", "sqlalchemy", "sqlite3", "records", "databases", "sqlmodel"] }

[[sink]]
call = ["pandas.read_sql", "pandas.read_sql_query", "pandas.io.sql.read_sql", "pandas.io.sql.read_sql_query"]
kind = "sql"
args = [0]
arg_names = ["sql"]
description = "pandas.read_sql runs a SQL string (a table name is also accepted but a query is the common use)"

# peewee: Database.execute_sql(sql, params), Model.raw(sql), SQL(sql) fragments.
[[sink]]
call = ["peewee.SQL", "peewee.Database.execute_sql", "peewee.*Database.execute_sql", "playhouse.**.execute_sql"]
kind = "sql"
args = [0]

# pony: Database.select / get / exists / execute / insert take SQL text; Entity.select_by_sql too.
[[sink]]
call = ["pony.orm.Database.select", "pony.orm.Database.get", "pony.orm.Database.exists", "pony.orm.Database.execute",
        "pony.orm.core.Database.select", "pony.orm.core.Database.get", "pony.orm.core.Database.exists",
        "pony.orm.core.Database.execute", "pony.orm.**.Entity.select_by_sql", "pony.orm.**.Entity.get_by_sql"]
kind = "sql"
args = [0]

# sqlite3 runs several statements, so injected text is arbitrary SQL.
[[sink]]
call = ["sqlite3.Connection.executescript", "sqlite3.Cursor.executescript", "connection.executescript",
        "cursor.executescript"]                  # a typed DB-API connection or cursor (value-types.toml)
kind = "sql"
args = [0]

# SQLAlchemy: Query.from_statement(text(...)) -- `text` is already a sink; literal_column and
# the query's filter(text(...)) / order_by(text(...)) forms are covered by `text`.
[[sink]]
call = ["sqlalchemy.sql.expression.literal_column", "sqlalchemy.literal_column"]
kind = "sql"
args = [0]

# records / databases (async): db.query("...") and database.fetch_all("...")
[[sink]]
call = ["databases.Database.fetch_all", "databases.Database.fetch_one", "databases.Database.execute",
        "databases.Database.fetch_val", "databases.Database.iterate", "records.Database.query"]
kind = "sql"
args = [0]
arg_names = ["query"]
