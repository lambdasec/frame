[pack]
name = "cherrypy"
language = "python"
description = "CherryPy exposed methods, request parameters, redirects and static file serving"
detect = { imports = ["cherrypy"] }

# The request (cherrypy._cprequest.Request); inside a request the module-level `cherrypy.request`
# (also `cherrypy.serving.request`) is that request in every function. Client data: the query and
# form parameters, the headers and cookie, the body, the JSON body (tools.json_in), the query string.
[[request_type]]
id = "Request"
fields = ["params", "headers", "header_list", "cookie", "body", "json", "query_string"]
headers = ["headers"]
proxies = ["cherrypy.request", "cherrypy.serving.request"]
references = ["https://docs.cherrypy.dev/en/latest/pkg/cherrypy._cprequest.html#cherrypy._cprequest.Request"]

# Every @cherrypy.expose method receives query / form / path segments as arguments.
[[entrypoint]]
id = "exposed"
decorator = ["cherrypy.expose", "expose", "*.expose"]
params = "all"

[[sink]]
call = ["cherrypy.HTTPRedirect", "cherrypy._cperror.HTTPRedirect", "cherrypy.lib.httputil.HTTPRedirect"]
kind = "redirect"
args = [0]

[[sink]]
call = ["cherrypy.lib.static.serve_file", "cherrypy.lib.static.serve_download"]
kind = "filesystem"
args = [0]
arg_names = ["path"]
