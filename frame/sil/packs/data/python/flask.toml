[pack]
name = "flask"
language = "python"
description = "Flask (and Quart, which keeps Flask's API): route view functions"
references = ["https://flask.palletsprojects.com/en/stable/quickstart/#variable-rules",
              "https://quart.palletsprojects.com/en/latest/"]
detect = { imports = ["flask", "quart"] }

# The request object (werkzeug's Request, which Flask subclasses; Quart keeps the same names, its
# body accessors awaitable). Inside a request the module-level proxy `flask.request` /
# `quart.request` is that request, in every function the view calls, whatever a helper names it.
# The client data: the parsed query string, form, combined values, uploads, cookies, headers, the
# raw body (also as streams) and its JSON, the parsed Authorization header, the raw query string,
# the URL's matched variables (`view_args`), and values parsed from headers (User-Agent, Referer,
# X-Forwarded-For). Uploaded files are file contents and client-given names; a cookie or the
# Authorization header is the caller's own credential. The path and URL forms (`path`, `url`,
# `host`...) are not listed: a route's rule fixes the path but for its variables, which are the
# view's arguments, and Host is the server's own name in a browser's request.
[[request_type]]
id = "Request"
fields = ["args", "form", "values", "files", "cookies", "headers", "data", "json", "authorization",
          "query_string", "view_args", "stream", "input_stream", "user_agent", "referrer", "access_route"]
methods = ["get_data", "get_json"]
kinds = { files = "file", cookies = "principal", authorization = "principal" }
headers = ["headers"]
proxies = ["flask.request", "quart.request"]
references = ["https://flask.palletsprojects.com/en/stable/api/#flask.Request",
              "https://werkzeug.palletsprojects.com/en/stable/wrappers/#werkzeug.wrappers.Request"]

# A view registered with @app.route / @bp.route or a method shortcut (@app.get, Flask 2.0+) receives
# the URL's variable parts (`/users/<int:id>`) as keyword arguments, by name (Flask docs "Variable
# Rules"): those parameters are client data. A parameter the rule does not name is a decorator's
# (`@token_required` handing in the user) or a default; a rule that is not written out at the
# decorator leaves every parameter client data.
[[entrypoint]]
id = "route-view"
registered_via = ["flask.Flask.route", "flask.Flask.get", "flask.Flask.post", "flask.Flask.put", "flask.Flask.patch", "flask.Flask.delete", "flask.Blueprint.route", "flask.Blueprint.get", "flask.Blueprint.post", "flask.Blueprint.put", "flask.Blueprint.patch", "flask.Blueprint.delete", "quart.Quart.route", "quart.Quart.get", "quart.Quart.post", "quart.Quart.put", "quart.Quart.patch", "quart.Quart.delete", "quart.Blueprint.route", "quart.Blueprint.get", "quart.Blueprint.post", "quart.Blueprint.put", "quart.Blueprint.patch", "quart.Blueprint.delete"]
params = "all"
route_syntax = "werkzeug"
route_args = ["0", "rule"]
description = "Flask view function argument (URL variable)"

# app.add_url_rule(rule, endpoint, view_func): the same view, registered by a call.
[[entrypoint]]
id = "url-rule-view"
registered_via = ["flask.Flask.add_url_rule", "flask.Blueprint.add_url_rule", "quart.Quart.add_url_rule",
                  "quart.Blueprint.add_url_rule"]
params = "all"
description = "Flask view function argument (URL variable)"

# flask.abort / werkzeug.exceptions.abort raise an HTTPException: the request handling ends there.
[[function]]
name = "flask.abort"
noreturn = true

[[function]]
name = "werkzeug.exceptions.abort"
noreturn = true
