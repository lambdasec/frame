# Address blocks that are not reachable from the internet, from IANA's special-purpose address
# registries (retrieved 2026-10-30):
#   https://www.iana.org/assignments/iana-ipv4-special-registry/
#   https://www.iana.org/assignments/iana-ipv6-special-registry/
# Each entry is the registry's "Globally Reachable" column (`reachable`; "N/A" or empty is kept as
# reachable: the registry does not say otherwise). The most specific block containing an address
# decides. Outside every block an IPv4 address is reachable unless it is multicast (224.0.0.0/4,
# never a source address: RFC 1122 3.2.1.3); an IPv6 address only inside 2000::/3, the global
# unicast space IANA allocates (https://www.iana.org/assignments/ipv6-address-space/).
#
# Loaded by frame/iac/addresses.py.

[ipv4]
outside = true
blocks = [
    { cidr = "0.0.0.0/8", reachable = false },  # This network
    { cidr = "0.0.0.0/32", reachable = false },  # This host on this network
    { cidr = "10.0.0.0/8", reachable = false },  # Private-Use
    { cidr = "100.64.0.0/10", reachable = false },  # Shared Address Space
    { cidr = "127.0.0.0/8", reachable = false },  # Loopback
    { cidr = "169.254.0.0/16", reachable = false },  # Link Local
    { cidr = "172.16.0.0/12", reachable = false },  # Private-Use
    { cidr = "192.0.0.0/24", reachable = false },  # IETF Protocol Assignments
    { cidr = "192.0.0.0/29", reachable = false },  # IPv4 Service Continuity Prefix
    { cidr = "192.0.0.8/32", reachable = false },  # IPv4 dummy address
    { cidr = "192.0.0.9/32", reachable = true },  # Port Control Protocol Anycast
    { cidr = "192.0.0.10/32", reachable = true },  # Traversal Using Relays around NAT Anycast
    { cidr = "192.0.0.170/32", reachable = false },  # NAT64/DNS64 Discovery
    { cidr = "192.0.0.171/32", reachable = false },  # NAT64/DNS64 Discovery
    { cidr = "192.0.2.0/24", reachable = false },  # Documentation (TEST-NET-1)
    { cidr = "192.31.196.0/24", reachable = true },  # AS112-v4
    { cidr = "192.52.193.0/24", reachable = true },  # AMT
    { cidr = "192.88.99.0/24", reachable = true },  # Deprecated (6to4 Relay Anycast)
    { cidr = "192.88.99.2/32", reachable = false },  # 6a44-relay anycast address
    { cidr = "192.168.0.0/16", reachable = false },  # Private-Use
    { cidr = "192.175.48.0/24", reachable = true },  # Direct Delegation AS112 Service
    { cidr = "198.18.0.0/15", reachable = false },  # Benchmarking
    { cidr = "198.51.100.0/24", reachable = false },  # Documentation (TEST-NET-2)
    { cidr = "203.0.113.0/24", reachable = false },  # Documentation (TEST-NET-3)
    { cidr = "240.0.0.0/4", reachable = false },  # Reserved
    { cidr = "255.255.255.255/32", reachable = false },  # Limited Broadcast
    { cidr = "224.0.0.0/4", reachable = false },  # Multicast (not a source address)
]

[ipv6]
outside = false
blocks = [
    { cidr = "2000::/3", reachable = true },  # Global Unicast
    { cidr = "::1/128", reachable = false },  # Loopback Address
    { cidr = "::/128", reachable = false },  # Unspecified Address
    { cidr = "::ffff:0:0/96", reachable = false },  # IPv4-mapped Address
    { cidr = "64:ff9b::/96", reachable = true },  # IPv4-IPv6 Translat.
    { cidr = "64:ff9b:1::/48", reachable = false },  # IPv4-IPv6 Translat.
    { cidr = "100::/64", reachable = false },  # Discard-Only Address Block
    { cidr = "100:0:0:1::/64", reachable = false },  # Dummy IPv6 Prefix
    { cidr = "2001::/23", reachable = false },  # IETF Protocol Assignments
    { cidr = "2001::/32", reachable = true },  # TEREDO
    { cidr = "2001:1::1/128", reachable = true },  # Port Control Protocol Anycast
    { cidr = "2001:1::2/128", reachable = true },  # Traversal Using Relays around NAT Anycast
    { cidr = "2001:1::3/128", reachable = true },  # DNS-SD Service Registration Protocol Anycast
    { cidr = "2001:2::/48", reachable = false },  # Benchmarking
    { cidr = "2001:3::/32", reachable = true },  # AMT
    { cidr = "2001:4:112::/48", reachable = true },  # AS112-v6
    { cidr = "2001:10::/28", reachable = true },  # Deprecated (previously ORCHID)
    { cidr = "2001:20::/28", reachable = true },  # ORCHIDv2
    { cidr = "2001:30::/28", reachable = true },  # Drone Remote ID Protocol Entity Tags (DETs) Prefix
    { cidr = "2001:db8::/32", reachable = false },  # Documentation
    { cidr = "2002::/16", reachable = true },  # 6to4
    { cidr = "2620:4f:8000::/48", reachable = true },  # Direct Delegation AS112 Service
    { cidr = "3fff::/20", reachable = false },  # Documentation
    { cidr = "5f00::/16", reachable = false },  # Segment Routing (SRv6) SIDs
    { cidr = "fc00::/7", reachable = false },  # Unique-Local
    { cidr = "fe80::/10", reachable = false },  # Link-Local Unicast
]
