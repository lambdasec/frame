[package]
name = "frame-sca-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# serde_json uses itoa 1.x; this asks for 0.4, so both versions are in the graph
itoa = "0.4"

[dev-dependencies]
pretty_assertions = "1"
