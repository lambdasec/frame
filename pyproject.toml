[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame"
dynamic = ["version"]
description = "Frame - Separation Logic Verification Tool with Security Scanning"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "codelion"}
]
keywords = [
    "separation-logic",
    "formal-verification",
    "security",
    "static-analysis",
    "vulnerability-detection",
    "smt",
    "z3"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "z3-solver>=4.8.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Security scanner: tree-sitter plus a grammar for every supported language.
scan = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.22.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
]
# Downloading and running the SL-COMP / SMT-LIB benchmark suites.
benchmarks = [
    "requests>=2.25.0",
    "zstandard>=0.22.0",
    "pyyaml>=6.0",
]
dev = [
    "frame[scan,benchmarks]",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.5.0",
    "mypy>=1.5.0",
]
all = [
    "frame[scan,benchmarks,dev]",
]

[project.scripts]
frame = "frame.cli:main"

[project.urls]
Homepage = "https://github.com/lambdasec/frame"
Documentation = "https://github.com/lambdasec/frame#readme"
Repository = "https://github.com/lambdasec/frame"
Issues = "https://github.com/lambdasec/frame/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["frame*"]

[tool.setuptools.dynamic]
version = {attr = "frame.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["benchmarks/cache"]

[tool.ruff.lint]
# Gate on real bugs only (syntax errors, undefined names, duplicate dict keys,
# shadowed imports). Style rules (unused imports, star imports) are tracked
# separately and are not enforced yet.
select = ["E9", "F63", "F7", "F82", "F601", "F402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
implicit_optional = true
check_untyped_defs = false

[tool.coverage.run]
source = ["frame"]
omit = ["tests/*", "benchmarks/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
