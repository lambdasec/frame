AWSTemplateFormatVersion: "2010-09-09"
Description: The marketing site, kept in CloudFormation by another team.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
  AdminCidr:
    Type: String
    Default: 0.0.0.0/0

Conditions:
  IsStaging: !Equals [!Ref Environment, staging]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "acme-marketing-${Environment}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SiteBucket}/*"

  CmsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CMS server
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr

  # Only in staging, which this template's default is not.
  DebugSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsStaging
    Properties:
      GroupDescription: debugging
      SecurityGroupIngress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
