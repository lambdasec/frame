apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  namespace: ops
spec:
  selector:
    matchLabels: {app: log-agent}
  template:
    metadata:
      labels: {app: log-agent}
    spec:
      hostNetwork: true
      containers:
      - name: agent
        image: ghcr.io/acme/log-agent:1.9.0
        securityContext:
          capabilities:
            add: ["SYS_ADMIN"]
        volumeMounts:
        - {name: varlog, mountPath: /var/log}
      volumes:
      - name: varlog
        hostPath: {path: /var/log}
