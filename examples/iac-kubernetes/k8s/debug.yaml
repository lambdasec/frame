apiVersion: v1
kind: Pod
metadata:
  name: node-debug
  namespace: ops
spec:
  hostPID: true  # frame: ignore[k8s-host-namespaces] break-glass pod, applied by hand only
  containers:
  - name: shell
    image: busybox:1.36
    command: ["sleep", "3600"]
    securityContext:
      # frame: ignore[k8s-privileged]
      privileged: true
    resources:
      limits: {memory: 64Mi}
